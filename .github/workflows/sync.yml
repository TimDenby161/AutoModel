name: Sync AutoModel Data

on:
  schedule:
    # ~21:17 UTC nightly. GitHub cron doesn't shift for daylight saving, so
    # this is about 10:17pm BST / 9:17pm GMT. Deliberately not on the hour:
    # GitHub's scheduler gets congested at round times and can drop runs.
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      sync_players:
        description: "Players"
        type: boolean
        default: true
      sync_managers:
        description: "Managers"
        type: boolean
        default: true
      sync_competitions:
        description: "Competitions / Leagues"
        type: boolean
        default: true
      sync_matches:
        description: "Matches"
        type: boolean
        default: true
      sync_clubs:
        description: "Clubs"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install gspread

      - name: Write service account credentials
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Build sync flags
        id: flags
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run - syncing everything."
          else
            [ "${{ inputs.sync_players }}" != "true" ] && FLAGS="$FLAGS --skip-players"
            [ "${{ inputs.sync_managers }}" != "true" ] && FLAGS="$FLAGS --skip-managers"
            [ "${{ inputs.sync_competitions }}" != "true" ] && FLAGS="$FLAGS --skip-competitions"
            [ "${{ inputs.sync_matches }}" != "true" ] && FLAGS="$FLAGS --skip-matches"
            [ "${{ inputs.sync_clubs }}" != "true" ] && FLAGS="$FLAGS --skip-clubs"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run sync
        run: python syncPlayersToSheet.py ${{ steps.flags.outputs.flags }}

      - name: Remove credentials
        if: always()
        run: rm -f service_account.json

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.csv'
          git diff --cached --quiet || git commit -m "Automated data sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) - main moved during the sync. Rebasing and retrying."
            git fetch origin main
            git rebase origin/main
          done
          echo "Still couldn't push after 5 attempts - giving up."
          exit 1

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoModel Data</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AutoModel">
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:      #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --series-blue:    #2a78d6;
    --series-orange:  #eb6834;
    --series-aqua:    #1baf7a;
    --status-good:    #0ca30c;
    --status-critical:#d03b3b;
    --status-warning: #d19d00;
    --chip-bg:        #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:      #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --series-blue:    #3987e5;
      --series-orange:  #d95926;
      --series-aqua:    #199e70;
      --status-good:    #0ca30c;
      --status-critical:#e66767;
      --status-warning: #f5c518;
      --chip-bg:        #26261f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --series-blue:    #3987e5;
    --series-orange:  #d95926;
    --series-aqua:    #199e70;
    --status-good:    #0ca30c;
    --status-critical:#e66767;
    --status-warning: #e0b636;
    --chip-bg:        #26261f;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  body { padding-bottom: env(safe-area-inset-bottom); }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  }
  header h1 {
    margin: 0 0 2px;
    font-size: 20px;
    font-weight: 700;
  }
  .meta-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  #status-line {
    font-size: 12px;
    color: var(--text-muted);
  }
  #refresh-btn {
    appearance: none; border: 1px solid var(--border); background: var(--chip-bg);
    color: var(--text-primary); border-radius: 8px; padding: 6px 12px;
    font-size: 13px; font-weight: 600; font-family: inherit;
  }
  #refresh-btn:active { opacity: 0.7; }
  #refresh-btn[data-loading="true"] { opacity: 0.5; pointer-events: none; }

  nav.tabs {
    display: flex; gap: 4px;
    background: var(--chip-bg);
    border-radius: 10px;
    padding: 3px;
    margin-top: 12px;
  }
  nav.tabs button {
    flex: 1; appearance: none; border: none; background: transparent;
    color: var(--text-secondary); font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 4px; border-radius: 8px;
  }
  nav.tabs button[aria-selected="true"] {
    background: var(--surface-1); color: var(--text-primary);
    box-shadow: 0 1px 2px var(--border);
  }

  main { padding: 12px 16px 40px; max-width: 720px; margin: 0 auto; }
  .panel { display: none; }
  .panel[data-active="true"] { display: block; }

  .empty-state {
    text-align: center; color: var(--text-muted); font-size: 14px;
    padding: 40px 16px;
  }

  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .match-card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; cursor: pointer;
  }
  .lineup-panel {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .lineup-pitch { display: flex; flex-direction: column; gap: 14px; }
  .pitch-team { min-width: 0; }
  .pitch-team-name { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .pitch-divider { height: 1px; background: var(--border); }
  .pitch-group { margin-top: 10px; }
  .pitch-group:first-child { margin-top: 0; }
  .pitch-player {
    display: flex; align-items: baseline; gap: 8px; padding: 3px 0;
  }
  .pitch-player-pos {
    color: var(--text-muted); font-size: 9px; font-weight: 700;
    text-transform: uppercase; width: 20px; flex-shrink: 0;
  }
  .pitch-player-name {
    flex: 1; min-width: 0; font-weight: 600; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Applied to the whole row (.pitch-player), not just the name - every
     element in that row (pos, name, ability, mins, xG) takes the same
     mins-tier color, overriding each element's own default color below. */
  .pitch-player.mins-green *  { color: var(--status-good); }
  .pitch-player.mins-yellow * { color: var(--status-warning); }
  .pitch-player.mins-orange * { color: var(--series-orange); }
  .pitch-player.mins-red *    { color: var(--status-critical); }
  .pitch-player-ability {
    color: var(--text-muted); font-weight: 600; font-size: 11px;
  }
  .pitch-player-mins {
    font-weight: 700; font-size: 13px; color: var(--series-blue);
    flex-shrink: 0; width: 28px; text-align: right;
  }
  .pitch-player-xg {
    font-weight: 600; font-size: 11px; color: var(--series-aqua);
    flex-shrink: 0; width: 34px; text-align: right;
  }
  .pitch-player-xa {
    font-weight: 600; font-size: 11px; color: var(--series-orange);
    flex-shrink: 0; width: 34px; text-align: right;
  }
  .match-comp {
    font-size: 11px; color: var(--text-muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.02em;
    text-align: right;
  }
  .comp-group { margin-top: 16px; }
  .comp-group:first-child { margin-top: 0; }
  .comp-group-header {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.03em;
    padding-bottom: 4px; margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .comp-group-header:active { opacity: 0.7; }
  .comp-group-caret {
    display: inline-block; font-size: 10px; width: 10px;
    color: var(--text-muted); flex-shrink: 0;
  }
  .comp-group-name {
    appearance: none; border: none; background: transparent; padding: 0;
    flex: 1; min-width: 0; text-align: left;
    font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit;
    cursor: pointer;
  }
  .comp-group-name:hover, .comp-group-name:focus-visible { text-decoration: underline; }
  .comp-group-count {
    color: var(--text-muted); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .comp-group.collapsed .card-list { display: none; }
  .comp-group.collapsed .comp-group-header { border-bottom-color: transparent; margin-bottom: 0; }
  .match-teams {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px; gap: 8px;
  }
  .match-team { flex: 1; font-size: 14px; font-weight: 600; }
  .match-team.away { text-align: right; }
  .club-score {
    display: block; width: fit-content; margin-top: 2px;
    padding: 2px 6px; border-radius: 6px;
    background: color-mix(in srgb, var(--series-blue) 16%, transparent);
    color: var(--series-blue);
    font-variant-numeric: tabular-nums;
    font-size: 11px; font-weight: 700;
  }
  .match-team.away .club-score { margin-left: auto; }
  .match-score {
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 13px; font-weight: 700;
    white-space: nowrap; flex-shrink: 0;
  }
  .match-score .vs-text {
    color: var(--text-muted); font-size: 12px; font-weight: 600;
    padding: 2px 6px;
  }
  .match-score.has-proj .vs-text { padding: 4px 0 0; }
  .proj-box {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; padding: 3px 6px; border-radius: 6px;
    background: color-mix(in srgb, var(--series-blue) 16%, transparent);
    color: var(--series-blue);
    font-variant-numeric: tabular-nums;
    font-size: 13px; font-weight: 700;
  }
  .score-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .match-score-sub {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .match-probs { margin-top: 8px; }
  .prob-bar {
    display: flex; gap: 2px; height: 6px;
    border-radius: 3px; overflow: hidden;
  }
  .prob-bar span { display: block; height: 100%; border-radius: 2px; }
  .prob-home { background: var(--series-blue); }
  .prob-draw { background: var(--text-muted); }
  .prob-away { background: var(--series-orange); }
  .prob-labels {
    position: relative; height: 14px; margin-top: 4px;
    font-size: 11px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .prob-labels span {
    position: absolute; top: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    white-space: nowrap; background: none;
  }
  .prob-labels .prob-home { color: var(--series-blue); }
  .prob-labels .prob-draw { color: var(--text-muted); }
  .prob-labels .prob-away { color: var(--series-orange); }

  .filters-wrap { margin-bottom: 10px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-row-more { margin-top: 6px; }
  .filter-row-more[hidden] { display: none; }
  .filter-chip {
    appearance: none; border: 1px solid var(--border); background: var(--chip-bg);
    color: var(--text-secondary); font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 20px;
    white-space: nowrap;
  }
  .filter-chip[aria-pressed="true"] {
    background: color-mix(in srgb, var(--series-blue) 16%, transparent);
    color: var(--series-blue); border-color: transparent;
  }
  .filter-more { color: var(--series-blue); font-weight: 700; }
  .filter-more[aria-expanded="true"] { background: var(--chip-bg); }
  .secondary-filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .date-filter-group { display: flex; align-items: center; gap: 2px; }
  .date-filter-input, .round-filter-select {
    appearance: none; border: 1px solid var(--border); background: var(--chip-bg);
    color: var(--text-secondary); font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 20px;
  }
  .round-filter-select:disabled { opacity: 0.5; }
  .round-filter-group { display: flex; align-items: center; gap: 4px; }
  .round-nav-btn {
    appearance: none; border: 1px solid var(--border); background: var(--chip-bg);
    color: var(--text-secondary); font-family: inherit; font-size: 14px; font-weight: 700;
    width: 26px; height: 26px; border-radius: 50%; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .round-nav-btn:disabled { opacity: 0.35; }
  .round-nav-btn:active:not(:disabled) { opacity: 0.6; }
  .date-filter-clear {
    appearance: none; border: none; background: transparent; color: var(--text-muted);
    font-size: 16px; line-height: 1; padding: 2px 8px; cursor: pointer;
  }
  .date-filter-clear[hidden] { display: none; }
  #table-view-toggle { margin-bottom: 10px; }

  .search-row { margin-bottom: 10px; }
  .search-row input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-primary); font-size: 14px; font-family: inherit;
  }

  table.leaderboard { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.leaderboard th, table.leaderboard td {
    padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--gridline);
  }
  table.leaderboard th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em;
    color: var(--text-muted); font-weight: 600; position: sticky; top: 0;
    background: var(--page-plane);
  }
  table.leaderboard td.num, table.leaderboard th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.leaderboard tbody tr:active { background: var(--chip-bg); }
  /* All 10 columns fit a phone-width screen without scrolling - narrow
     numeric columns, Club takes whatever width is left over. */
  .standings-table { table-layout: fixed; font-size: 11px; }
  .standings-table th, .standings-table td { padding: 6px 3px; }
  .standings-table th:first-child, .standings-table td:first-child { width: 18px; padding-left: 0; }
  .standings-table th:nth-child(3), .standings-table td:nth-child(3),
  .standings-table th:nth-child(4), .standings-table td:nth-child(4),
  .standings-table th:nth-child(5), .standings-table td:nth-child(5),
  .standings-table th:nth-child(6), .standings-table td:nth-child(6) { width: 18px; }
  .standings-table th:nth-child(7), .standings-table td:nth-child(7),
  .standings-table th:nth-child(8), .standings-table td:nth-child(8) { width: 22px; }
  .standings-table th:nth-child(9), .standings-table td:nth-child(9) { width: 26px; }
  .standings-table th:last-child, .standings-table td:last-child {
    width: 28px; font-weight: 700; padding-right: 0;
  }
  .standings-table td:nth-child(2) { overflow-wrap: break-word; }
  /* Player/Price/Mins stay pinned on the left while xPts/2GW/5GW/6GW/xG/xA/Def
     scroll underneath - compact padding+font so more of the scrolling half
     fits on screen at once too. */
  .fpl-table-compact { font-size: 11px; table-layout: fixed; width: 460px; }
  .fpl-table-compact th, .fpl-table-compact td { padding: 6px 4px; }
  .fpl-table-compact th:nth-child(1), .fpl-table-compact td:nth-child(1),
  .fpl-table-compact th:nth-child(2), .fpl-table-compact td:nth-child(2),
  .fpl-table-compact th:nth-child(3), .fpl-table-compact td:nth-child(3) {
    position: sticky; background: var(--page-plane); z-index: 1;
  }
  .fpl-table-compact th:nth-child(1), .fpl-table-compact th:nth-child(2), .fpl-table-compact th:nth-child(3) {
    z-index: 2;
  }
  .fpl-table-compact th:nth-child(1), .fpl-table-compact td:nth-child(1) { left: 0; width: 100px; }
  .fpl-table-compact th:nth-child(2), .fpl-table-compact td:nth-child(2) { left: 100px; width: 42px; }
  .fpl-table-compact th:nth-child(3), .fpl-table-compact td:nth-child(3) {
    left: 142px; width: 38px;
    box-shadow: 2px 0 4px -2px rgba(11, 11, 11, 0.15);
  }
  .fpl-table-compact .player-name { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
  .fpl-table-compact .player-sub { font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
  .fpl-table-compact th:nth-child(n+4), .fpl-table-compact td:nth-child(n+4) { width: 40px; }
  .player-name { font-weight: 600; }
  .player-sub { color: var(--text-muted); font-size: 11px; }
  th.sortable { cursor: pointer; }
  th.sortable.active { color: var(--series-blue); }

  .ai-fpl-actions { display: flex; gap: 8px; margin-bottom: 10px; }
  .action-btn {
    appearance: none; border: 1px solid var(--border); background: var(--chip-bg);
    color: var(--text-primary); border-radius: 8px; padding: 8px 12px;
    font-size: 13px; font-weight: 600; font-family: inherit; flex: 1;
  }
  .action-btn:active { opacity: 0.7; }
  .action-btn:disabled { opacity: 0.5; }
  .ai-fpl-status { color: var(--text-muted); font-size: 12px; margin-bottom: 10px; min-height: 16px; }
  .ai-gw-card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .ai-gw-header {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 13px; font-weight: 700; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .ai-gw-section-label {
    color: var(--text-muted); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em; margin: 10px 0 4px;
  }
  .ai-player { padding: 3px 0; }
  .ai-player-top { display: flex; align-items: baseline; gap: 8px; }
  .ai-player-pos {
    color: var(--text-muted); font-size: 9px; font-weight: 700;
    text-transform: uppercase; width: 26px; flex-shrink: 0;
  }
  .ai-player-name {
    flex: 1; min-width: 0; font-weight: 600; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ai-player-xpts {
    font-weight: 700; font-size: 13px; color: var(--series-blue); flex-shrink: 0;
  }
  .ai-player-meta { margin-left: 34px; color: var(--text-muted); font-size: 10px; }
  .ai-top-row {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;
  }
  .ai-transfers-card, .ai-squad-card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    flex: 1 1 260px; min-width: 260px;
  }
  .ai-transfers-title { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .ai-transfer-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
  }
  .ai-transfer-row + .ai-transfer-row { border-top: 1px solid var(--border); }
  .ai-transfer-gw {
    flex-shrink: 0; font-size: 10px; font-weight: 700; color: var(--text-muted);
    width: 30px;
  }
  .ai-transfer-players { flex: 1; min-width: 0; }
  .ai-transfer-out {
    font-size: 12px; font-weight: 600; color: var(--status-critical);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ai-transfer-in {
    font-size: 12px; font-weight: 600; color: var(--status-good);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ai-transfer-type {
    flex-shrink: 0; font-size: 10px; font-weight: 700; text-transform: uppercase;
    padding: 2px 6px; border-radius: 6px; background: var(--chip-bg); color: var(--text-secondary);
    white-space: nowrap;
  }

  .config-warning {
    background: var(--chip-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; font-size: 13px; color: var(--text-secondary); line-height: 1.5;
  }
  .config-warning code {
    background: var(--surface-1); padding: 1px 5px; border-radius: 4px; font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>AutoModel Data</h1>
  <div class="meta-row">
    <span id="status-line">Loading&hellip;</span>
    <button id="refresh-btn" type="button">Refresh</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="fixtures" aria-selected="true">Fixtures</button>
    <button role="tab" data-tab="results" aria-selected="false">Results</button>
    <button role="tab" data-tab="table" aria-selected="false">Table</button>
    <button role="tab" data-tab="fpl" aria-selected="false">FPL</button>
    <button role="tab" data-tab="ai-fpl" aria-selected="false">AI FPL</button>
  </nav>
</header>

<main>
  <section class="panel" data-tab="fixtures" data-active="true">
    <div class="filters-wrap" id="fixture-filters">
      <div class="filter-row"></div>
      <div class="filter-row filter-row-more" hidden></div>
    </div>
    <div class="secondary-filters">
      <div class="date-filter-group">
        <input type="date" id="fixture-date-filter" class="date-filter-input" aria-label="Filter fixtures by date">
        <button type="button" class="date-filter-clear" id="fixture-date-clear" hidden aria-label="Clear date filter">&times;</button>
      </div>
      <div class="round-filter-group">
        <button type="button" class="round-nav-btn" id="fixture-round-prev" aria-label="Previous round" disabled>&#8249;</button>
        <select id="fixture-round-filter" class="round-filter-select" disabled>
          <option value="">Select a league for rounds</option>
        </select>
        <button type="button" class="round-nav-btn" id="fixture-round-next" aria-label="Next round" disabled>&#8250;</button>
      </div>
    </div>
    <div id="fixtures-list" class="card-list"></div>
  </section>

  <section class="panel" data-tab="results">
    <div class="filters-wrap" id="result-filters">
      <div class="filter-row"></div>
      <div class="filter-row filter-row-more" hidden></div>
    </div>
    <div class="secondary-filters">
      <div class="date-filter-group">
        <input type="date" id="result-date-filter" class="date-filter-input" aria-label="Filter results by date">
        <button type="button" class="date-filter-clear" id="result-date-clear" hidden aria-label="Clear date filter">&times;</button>
      </div>
      <div class="round-filter-group">

function showConfigWarning(container) {

  </div>`;

// Fetches one tab's full contents as a raw array-of-arrays via the Sheets
// API v4 - see the CONFIG comment for why this replaced the old "Publish to
// web" CSV export (that pipeline had a ~15-22s floor per tab regardless of
// size, and would occasionally hang for minutes; this is typically under a
// second). FORMATTED_VALUE matches what the CSV export used to hand back
// (e.g. dates as the same ISO strings already used elsewhere, not raw
// Sheets serial numbers), so none of the downstream parsing needed to change.
async function fetchSheetValues(sheetName) {
  const url =
    `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.spreadsheetId}/values/` +
    `${encodeURIComponent(sheetName)}?key=${CONFIG.sheetsApiKey}&valueRenderOption=FORMATTED_VALUE`;
  const res = await fetch(url);
  if (!res.ok) {
    const body = await res.text().catch(() => "");
    throw new Error(`Sheets API "${sheetName}" failed (${res.status}): ${body.slice(0, 200)}`);
  }
  const data = await res.json();
  return data.values || [];
}

// Mirrors what the old PapaParse-based parseCsv/parseCsvWithHeaderRow calls
// relied on: drop rows that are entirely blank across every column (their
// skipEmptyLines:true), then build header->value objects from the row at
// headerRowIndex (0 for most tabs; FPL's real column headers sit one row
// below a merged group-label row - e.g. "xPts" spans several columns whose
// own headers are just "1".."5" - so FPL is called with 1). Repeated header
// names are de-duplicated the same way PapaParse's header:true does: the
// first occurrence keeps its bare name, later ones get _1, _2, ... (e.g.
// Matches' three "ID" columns become ID/ID_1/ID_2, used for the
// competition/home-club/away-club IDs respectively).
function sheetRowsToObjects(values, headerRowIndex = 0) {
  const rows = sheetRowsRaw(values);
  if (rows.length <= headerRowIndex) return [];
  const seen = new Map();
  const keys = rows[headerRowIndex].map((h, i) => {
    let key = (h || "").trim() || `col${i}`;
    if (seen.has(key)) {
      const count = seen.get(key) + 1;
      seen.set(key, count);
      key = `${key}_${count}`;
    } else {
      seen.set(key, 0);
    }
    return key;
  });
  return rows.slice(headerRowIndex + 1).map((row) => {
    const obj = {};
    keys.forEach((k, i) => { obj[k] = row[i]; });
    return obj;
  });
}

// Raw-array equivalent of the old parseCsvRaw - just the skipEmptyLines
// filtering, no header/object conversion (AIXI's repeating GW-block layout
// parses itself from row indices - see parseAiFplBlocks).
function sheetRowsRaw(values) {
  return (values || []).filter((row) => row.some((cell) => String(cell ?? "").trim() !== ""));
}

// FPL's "xPts" group's first sub-column is a moving target - its header
// reads "1" only at the very start of a season, then "2", "3"... as
// gameweeks pass (the same dynamic window AIXI's own readFplPlayers_
// already accounts for on the Apps Script side). Attaches each row's real
// next-gameweek xPts value as .xptsNext by column POSITION - found via the
// merged "xPts" label in the group-header row above the real headers -
// rather than by a name that stops matching once GW1 is over.
function attachFplXptsNext(fplRows, values) {
  const groupRow = (values[0] || []).map((h) => String(h || "").trim().toLowerCase());
  const xptsCol = groupRow.indexOf("xpts");
  if (xptsCol < 0) return;
  const dataRows = sheetRowsRaw(values).slice(2); // past the group-label row and the real header row
  fplRows.forEach((row, i) => {
    row.xptsNext = dataRows[i] ? dataRows[i][xptsCol] : "";
  });
}

// The AIXI tab isn't one flat table - it's repeating blocks, each starting
// with its own label row ("GW1 XI - 3-5-2 - 76.83 xPts") followed by its
// own header row (Role, Pos, Player, Club, Price, xPts, Order), then the
// XI and Bench rows for that gameweek. Walk the raw rows and regroup them.
function parseAiFplBlocks(rows) {
  const gwHeaderRe = /^GW(\d+)\s+XI/i;
  const blocks = [];
  let current = null;

  rows.forEach((row) => {
    const first = (row[0] || "").trim();
    const match = first.match(gwHeaderRe);
    if (match) {
      if (current) blocks.push(current);
      const formationMatch = first.match(/\d+-\d+(?:-\d+)*/);
      const xptsMatch = first.match(/([\d.]+)\s*xPts/i);
      current = {
        gw: Number(match[1]),
        label: first,
        formation: formationMatch ? formationMatch[0] : "",
        totalXpts: xptsMatch ? toNum(xptsMatch[1]) : 0,
        xi: [],
        bench: [],
      };
      return;
    }
    if (!current) return;
    if (first === "Role") return; // this block's own header row
    const [role, pos, player, club, price, xpts, order] = row;
    if (!player) return;
    const entry = {
      pos: (pos || "").trim(),
      player: (player || "").trim(),
      club: (club || "").trim(),
      price: toNum(price),
      xpts: toNum(xpts),
      order: toNum(order),
    };
    if ((role || "").trim().toLowerCase() === "bench") current.bench.push(entry);
    else current.xi.push(entry);
  });
  if (current) blocks.push(current);

  blocks.forEach((b) => b.bench.sort((a, c) => a.order - c.order));
  return blocks;
}

// The Transfer plan table (AIXI!L14:U...) sits in the same published rows as
// the GW XI blocks above, just further right (columns L-U, indices 11-20) -
// same CSV, different columns, so this is a second pass over the same rows
// rather than a second fetch.
function parseAiFplTransfers(rows) {
  let title = "";
  let headerRow = -1;
  for (let i = 0; i < rows.length; i++) {
    const l = (rows[i][11] || "").trim();
    if (/^Transfers from current AIXI squad/i.test(l)) title = l;
    if (l === "GW" && (rows[i][12] || "").trim() === "Sell") {
      headerRow = i;
      break;
    }
  }
  if (headerRow < 0) return { title, moves: [] };

  const moves = [];
  for (let i = headerRow + 1; i < rows.length; i++) {
    const row = rows[i];
    const gw = Number((row[11] || "").trim());
    if (!Number.isFinite(gw) || !row[11]) break; // hit the trailing summary rows or end of the table
    const [, sell, , buy, , type, gain] = row.slice(11, 20);
    if ((type || "").trim().toUpperCase() === "ROLL") continue; // nothing to action for a rolled week
    if (!(sell || "").trim() && !(buy || "").trim()) continue;
    moves.push({
      gw,
      sell: (sell || "").trim(),
      buy: (buy || "").trim(),
      type: (type || "").trim(),
      gain: toNum(gain),
    });
  }
  return { title, moves };
}

// The current-squad table (AIXI!A8:J23) sits in the same published rows too,
// above the GW XI blocks - same CSV, same second pass.
function parseAiFplCurrentSquad(rows) {
  let headerRow = -1;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if ((row[0] || "").trim() === "Pos" && (row[1] || "").trim() === "Player" && (row[2] || "").trim() === "Club") {
      headerRow = i;
      break;
    }
  }
  if (headerRow < 0) return [];

  const squad = [];
  for (let i = headerRow + 1; i < rows.length; i++) {
    const row = rows[i];
    const pos = (row[0] || "").trim();
    const player = (row[1] || "").trim();
    if (!pos || !player) break;
    squad.push({
      pos,
      player,
      club: (row[2] || "").trim(),
      price: toMoney(row[3]), // cell reads "£6.0" - toNum's plain parseFloat chokes on the currency symbol
      xpts: toNum(row[5]), // first of the GW columns - next-gameweek projected points
    });
  }
  return squad;
}

function toNum(v) {
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : 0;
}

// Like toNum, but strips a leading currency symbol first (e.g. AIXI's Price
// column reads "£6.0" as FORMATTED_VALUE text - plain parseFloat can't
// start a match on a non-numeric character, so it'd otherwise read as 0).
function toMoney(v) {
  return toNum(String(v ?? "").replace(/[^0-9.-]/g, ""));
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function formatKickoff(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString(undefined, {
    weekday: "short", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit",
  });
}

function isSameLocalDay(dateStr, reference) {
  const d = new Date(dateStr);
  return (
    d.getFullYear() === reference.getFullYear() &&
    d.getMonth() === reference.getMonth() &&
    d.getDate() === reference.getDate()
  );
}

// HomeScr/AwayScr (columns V/Y on the Matches tab) are per-club rating
// values, not the match result - published as formatted numbers (e.g.
// "1,007") so commas need stripping before parsing.
function clubScoreLabel(raw) {
  if (raw == null || String(raw).trim() === "") return "";
  const n = parseFloat(String(raw).replace(/,/g, ""));
  if (!Number.isFinite(n)) return "";
  return `<div class="club-score">${n.toLocaleString()}</div>`;
}

function matchScoreCenter(m) {
  const projH = parseFloat(m.ProjH);
  const projA = parseFloat(m.ProjA);
  if (!Number.isFinite(projH) || !Number.isFinite(projA)) {
    return `<div class="match-score"><span class="vs-text">vs</span></div>`;
  }
  return `
    <div class="match-score has-proj">
      <span class="proj-box">${projH.toFixed(1)}</span>
      <span class="vs-text">vs</span>
      <span class="proj-box">${projA.toFixed(1)}</span>
    </div>
  `;
}

// HW_1/D_1/AW_1: the Matches tab has two HW/D/AW column sets (columns
// AL-AN are 0/1 actual-result flags, AO-AQ are the model's win/draw/loss
// probabilities) - PapaParse dedupes the repeated headers by suffixing
// the second set with "_1". Only render once there's a real projection;
// the model rows without one carry a placeholder 0/1/0 (guaranteed draw).
// Shared by matchProbsRow (Fixtures - live, ever-updating projection) and
// matchProbsRowSnapshot (Results - frozen at whatever was projected before
// kickoff, since HomeScr/AwayScr and everything derived from them are
// TODAY()-dependent formulas that keep drifting after a match is finished).
function renderProbBar(projH, projA, hw, draw, aw) {
  if (!Number.isFinite(projH) || !Number.isFinite(projA)) return "";
  if (![hw, draw, aw].every(Number.isFinite)) return "";

  const pctHw = Math.round(hw * 100);
  const pctDraw = Math.round(draw * 100);
  const pctAw = Math.round(aw * 100);
  const drawStart = pctHw;
  const awayStart = pctHw + pctDraw;
  return `
    <div class="match-probs">
      <div class="prob-bar">
        <span class="prob-home" style="width:${pctHw}%"></span>
        <span class="prob-draw" style="width:${pctDraw}%"></span>
        <span class="prob-away" style="width:${pctAw}%"></span>
      </div>
      <div class="prob-labels">
        <span class="prob-home" style="left:0%; width:${pctHw}%">${pctHw}%</span>
        <span class="prob-draw" style="left:${drawStart}%; width:${pctDraw}%">${pctDraw}%</span>
        <span class="prob-away" style="left:${awayStart}%; width:${pctAw}%">${pctAw}%</span>
      </div>
    </div>
  `;
}

function matchProbsRow(m) {
  return renderProbBar(
    parseFloat(m.ProjH), parseFloat(m.ProjA),
    parseFloat(m.HW_1), parseFloat(m.D_1), parseFloat(m.AW_1)
  );
}

// Results uses the frozen pre-kickoff snapshot instead of the live figures.
function matchProbsRowSnapshot(m) {
  return renderProbBar(
    parseFloat(m.SnapProjH), parseFloat(m.SnapProjA),
    parseFloat(m.SnapHomeWinPct), parseFloat(m.SnapDrawPct), parseFloat(m.SnapAwayWinPct)
  );
}

// Always show the next N upcoming fixtures for whichever filter is active,
// regardless of whether any of them are today - a thin match day (or one
// with nothing at all, e.g. a season that hasn't started) shouldn't leave
// the list looking empty when there's plenty more coming up.
const FIXTURES_LOOKAHEAD_COUNT = 20;
// Every fixture within this many days is always shown, even past the cap
// above - otherwise a competition with few near-term matches (e.g. a
// midweek cup tie) can get crowded off the list by busier leagues with more
// fixtures on the same days.
const FIXTURES_GUARANTEED_DAYS = 4;

// <input type="date">'s value is "YYYY-MM-DD" - new Date(str) on that parses
// as UTC midnight, which can land on the wrong local day in negative-UTC
// timezones. Parse the components directly instead, so it lands on local
// midnight and compares correctly via isSameLocalDay.
function parseLocalDateInput(value) {
  if (!value) return null;
  const [y, m, d] = value.split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

// Fixtures/Results filter chips are generated from whichever competitions
// are actually in the data, keyed by Competition ID (not the raw "League"
// text - see COMPETITION_LABELS), most active first.
function buildCompetitionList() {
  const counts = new Map();
  state.fixtures.forEach((m) => {
    const id = String(m.ID || "").trim();
    if (!id) return;
    if (!counts.has(id)) counts.set(id, { id, autoLabel: m.League || id, count: 0 });
    counts.get(id).count++;
  });
  const list = [...counts.values()].map((c) => ({
    id: c.id,
    label: COMPETITION_LABELS[c.id] || c.autoLabel,
    count: c.count,
  }));
  list.sort((a, b) => b.count - a.count);
  return list;
}

// "all" -> no filter, "eng" -> the fixed English-competition set, anything
// else -> that one specific Competition ID.
function competitionIdsFor(filterValue) {
  if (filterValue === "all") return null;
  if (filterValue === "eng") return ENGLISH_COMPETITION_IDS;
  return [filterValue];
}

// Whether a filter value represents exactly one real competition - "all"
// and "eng" are aggregates spanning many competitions with unrelated round
// numbering, so round-based browsing doesn't apply to them.
function isSingleCompetitionFilter(filterValue) {
  return filterValue !== "all" && filterValue !== "eng";
}

function dateStrOf(dateValue) {
  const d = new Date(dateValue);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function todayDateStr() {
  return dateStrOf(new Date());
}

// The most recent day with at least one finished match, across whatever
// competitions are in scope - Results' "All"/"English Teams" default.
function mostRecentResultDateStr() {
  const finished = state.fixtures.filter((m) => toNum(m.Finished) === 1 && toNum(m.Cancelled) === 0 && m.Date);
  if (!finished.length) return "";
  const latest = finished.reduce((max, m) => (new Date(m.Date) > new Date(max.Date) ? m : max));
  return dateStrOf(latest.Date);
}

// The round of the soonest upcoming match (Fixtures) / most recent finished
// match (Results) for a single competition - "next round"/"last round".
function defaultRoundFor(prefix, filterValue) {
  const ids = competitionIdsFor(filterValue);
  if (!ids) return "";
  const isFixtures = prefix === "fixture";
  const relevant = state.fixtures.filter((m) =>
    ids.includes(String(m.ID)) &&
    toNum(m.Cancelled) === 0 &&
    m.Date &&
    (isFixtures ? toNum(m.Started) === 0 : toNum(m.Finished) === 1)
  );
  if (!relevant.length) return "";
  relevant.sort((a, b) =>
    isFixtures ? new Date(a.Date) - new Date(b.Date) : new Date(b.Date) - new Date(a.Date)
  );
  return String(relevant[0].Round || "").trim();
}

// Sets the date/round filters to this filter's default view: "All"/
// "English Teams" browse by date (today for Fixtures, most recent match day
// for Results); one specific competition browses by round instead (next
// round for Fixtures, last round for Results).
function applyDefaultDateAndRound(prefix) {
  const filterValue = state[`${prefix}Filter`];
  const dateInput = document.getElementById(`${prefix}-date-filter`);
  const dateClear = document.getElementById(`${prefix}-date-clear`);

  if (isSingleCompetitionFilter(filterValue)) {
    state[`${prefix}DateFilter`] = "";
    state[`${prefix}RoundFilter`] = defaultRoundFor(prefix, filterValue);
  } else {
    state[`${prefix}DateFilter`] = prefix === "fixture" ? todayDateStr() : mostRecentResultDateStr();
    state[`${prefix}RoundFilter`] = "";
  }
  dateInput.value = state[`${prefix}DateFilter`];
  dateClear.hidden = !state[`${prefix}DateFilter`];
}

// (Re)builds the league filter chips for a Fixtures/Results panel from
// buildCompetitionList - "All" and "English Teams" are always pinned first,
// then real competitions most-active-first, split across the visible row
// and the "More" row the same way the old static markup did.
function renderLeagueFilterChips(prefix) {
  const wrap = document.getElementById(`${prefix}-filters`);
  const mainRow = wrap.querySelector(".filter-row");
  const moreRow = wrap.querySelector(".filter-row-more");
  const currentFilter = state[`${prefix}Filter`];
  const competitions = buildCompetitionList();

  const chip = (id, label) =>
    `<button type="button" class="filter-chip" data-filter="${escapeHtml(id)}" aria-pressed="${currentFilter === id}">${escapeHtml(label)}</button>`;

  const pinned = [chip("all", "All"), chip("eng", "English Teams")];
  const visibleCount = 5;
  const primary = competitions.slice(0, visibleCount).map((c) => chip(c.id, c.label));
  const rest = competitions.slice(visibleCount).map((c) => chip(c.id, c.label));

  mainRow.innerHTML =
    pinned.join("") +
    primary.join("") +
    `<button type="button" class="filter-chip filter-more" data-more-toggle aria-expanded="false">More &#9662;</button>`;
  moreRow.innerHTML = rest.join("");
  moreRow.hidden = true;
  wireMoreToggle(wrap);
}

// Applies a league selection and its default date/round view - used by both
// the filter chips and clicking a competition's name in a group header (see
// renderGroupedMatches).
function selectLeagueFilter(prefix, filterValue) {
  const wrap = document.getElementById(`${prefix}-filters`);
  wrap.querySelectorAll(".filter-chip[data-filter]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.filter === filterValue))
  );
  const targetChip = wrap.querySelector(`.filter-chip[data-filter="${CSS.escape(filterValue)}"]`);
  if (targetChip && targetChip.closest(".filter-row-more")) {
    const moreRow = wrap.querySelector(".filter-row-more");
    const toggle = wrap.querySelector("[data-more-toggle]");
    moreRow.hidden = false;
    toggle.setAttribute("aria-expanded", "true");
    toggle.innerHTML = "Less &#9652;";
  }

  state[`${prefix}Filter`] = filterValue;
  applyDefaultDateAndRound(prefix);
  populateRoundFilter(prefix);
  (prefix === "fixture" ? renderFixtures : renderResults)();
}

// The sorted list of rounds actually present for the currently selected
// competition - shared by populateRoundFilter (the <select>'s options) and
// stepRound (the prev/next buttons), so both always agree on what "next"
// means. Empty for "All"/"English Teams" - round numbers aren't comparable
// across competitions.
function getAvailableRounds(prefix) {
  const filterValue = state[`${prefix}Filter`];
  if (!isSingleCompetitionFilter(filterValue)) return [];
  const ids = competitionIdsFor(filterValue);
  const isFixtures = prefix === "fixture";
  const relevant = state.fixtures.filter((m) =>
    ids.includes(String(m.ID)) &&
    toNum(m.Cancelled) === 0 &&
    (isFixtures ? toNum(m.Started) === 0 : toNum(m.Finished) === 1)
  );
  const rounds = [...new Set(relevant.map((m) => String(m.Round || "").trim()).filter(Boolean))];
  rounds.sort((a, b) => {
    const na = parseFloat(a);
    const nb = parseFloat(b);
    if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
    return a.localeCompare(b);
  });
  return rounds;
}

// Rebuilds the Round <select> for a Fixtures/Results panel from
// getAvailableRounds. Call whenever the league filter changes or fresh data
// loads, since both can change which rounds are available.
function populateRoundFilter(prefix) {
  const select = document.getElementById(`${prefix}-round-filter`);
  const rounds = getAvailableRounds(prefix);

  if (!isSingleCompetitionFilter(state[`${prefix}Filter`])) {
    select.innerHTML = `<option value="">Select a league for rounds</option>`;
    select.disabled = true;
    state[`${prefix}RoundFilter`] = "";
    updateRoundNavButtons(prefix);
    return;
  }

  const currentValue = state[`${prefix}RoundFilter`];
  select.innerHTML =
    `<option value="">All rounds</option>` +
    rounds.map((r) => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join("");
  select.disabled = rounds.length === 0;
  if (rounds.includes(currentValue)) {
    select.value = currentValue;
  } else {
    state[`${prefix}RoundFilter`] = "";
    select.value = "";
  }
  updateRoundNavButtons(prefix);
}

// Enables/disables the prev/next round buttons based on where the current
// round sits in getAvailableRounds - disabled entirely with no rounds
// available, and at whichever end is already showing.
function updateRoundNavButtons(prefix) {
  const rounds = getAvailableRounds(prefix);
  const prevBtn = document.getElementById(`${prefix}-round-prev`);
  const nextBtn = document.getElementById(`${prefix}-round-next`);
  const idx = rounds.indexOf(state[`${prefix}RoundFilter`]);

  prevBtn.disabled = rounds.length === 0 || idx === 0;
  nextBtn.disabled = rounds.length === 0 || idx === rounds.length - 1;
}

// Moves the round filter one step forward (direction=1) or back
// (direction=-1) through getAvailableRounds. If no round is currently
// selected (e.g. the user had picked "All rounds"), next jumps to the
// first round and previous jumps to the last.
function stepRound(prefix, direction) {
  const rounds = getAvailableRounds(prefix);
  if (!rounds.length) return;
  let idx = rounds.indexOf(state[`${prefix}RoundFilter`]);
  idx = idx === -1 ? (direction > 0 ? 0 : rounds.length - 1) : Math.min(rounds.length - 1, Math.max(0, idx + direction));

  state[`${prefix}RoundFilter`] = rounds[idx];
  document.getElementById(`${prefix}-round-filter`).value = rounds[idx];
  updateRoundNavButtons(prefix);
  (prefix === "fixture" ? renderFixtures : renderResults)();
}

// Groups an already-sorted match list by Competition ID (not the raw
// "League" text - see COMPETITION_LABELS), preserving each group's position
// from wherever its first match falls in that order - so fixtures group
// with the soonest-kicking-off competition first, and results group with
// the most-recently-finished competition first.
function groupByCompetition(matches) {
  const order = [];
  const groups = {};
  matches.forEach((m) => {
    const id = String(m.ID || "").trim() || "other";
    if (!groups[id]) {
      groups[id] = { id, label: COMPETITION_LABELS[id] || m.League || "Other", matches: [] };
      order.push(id);
    }
    groups[id].matches.push(m);
  });
  return order.map((id) => groups[id]);
}

// Shared by renderFixtures/renderResults - wraps each competition's cards in
// a collapsible group. collapsedSet is whichever of state.collapsedFixture/
// ResultGroups applies, so a group's open/closed state survives re-renders.
// The competition name is its own clickable target (data-jump-league) that
// switches the filter to just that competition, defaulting to its next/last
// round - separate from the caret/count, which just toggle the collapse
// (see the click handlers on #fixtures-list/#results-list).
function renderGroupedMatches(groups, collapsedSet, cardHtmlFn) {
  return groups.map((g) => {
    const collapsed = collapsedSet.has(g.id);
    return `
      <div class="comp-group${collapsed ? " collapsed" : ""}" data-comp-id="${escapeHtml(g.id)}">
        <div class="comp-group-header">
          <span class="comp-group-caret">${collapsed ? "&#9656;" : "&#9662;"}</span>
          <button type="button" class="comp-group-name" data-jump-league="${escapeHtml(g.id)}">${escapeHtml(g.label)}</button>
          <span class="comp-group-count">${g.matches.length}</span>
        </div>
        <div class="card-list">${g.matches.map(cardHtmlFn).join("")}</div>
      </div>
    `;
  }).join("");
}

function toggleGroupCollapse(groupEl, collapsedSet) {
  if (!groupEl) return;
  const id = groupEl.dataset.compId;
  const collapsed = collapsedSet.has(id);
  if (collapsed) {
    collapsedSet.delete(id);
  } else {
    collapsedSet.add(id);
  }
  groupEl.classList.toggle("collapsed", !collapsed);
  const caret = groupEl.querySelector(".comp-group-caret");
  if (caret) caret.innerHTML = !collapsed ? "&#9656;" : "&#9662;";
}

function renderFixtures() {
  const container = document.getElementById("fixtures-list");
  const today = new Date();
  const leagueIds = competitionIdsFor(state.fixtureFilter);
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const dateFilter = parseLocalDateInput(state.fixtureDateFilter);
  const roundFilter = state.fixtureRoundFilter;
  const allUpcoming = state.fixtures
    .filter((m) => toNum(m.Started) === 0 && toNum(m.Cancelled) === 0 && m.Date)
    .filter((m) => new Date(m.Date) >= todayStart)
    .filter((m) => !leagueIds || leagueIds.includes(String(m.ID)))
    .filter((m) => !dateFilter || isSameLocalDay(m.Date, dateFilter))
    .filter((m) => !roundFilter || String(m.Round || "").trim() === roundFilter)
    .sort((a, b) => new Date(a.Date) - new Date(b.Date));

  if (!allUpcoming.length) {
    container.innerHTML = `<div class="empty-state">No fixtures found.</div>`;
    return;
  }

  // A specific date or round is a deliberately narrow query - show
  // everything that matches instead of capping/backfilling like the
  // default rolling view does.
  let upcoming;
  let note = "";
  if (dateFilter || roundFilter) {
    upcoming = allUpcoming;
  } else {
    // Everything within the guaranteed window always makes the list; beyond
    // that, backfill with the next-soonest fixtures up to the cap so a quiet
    // stretch still shows plenty coming up.
    const guaranteedThrough = new Date(todayStart);
    guaranteedThrough.setDate(guaranteedThrough.getDate() + FIXTURES_GUARANTEED_DAYS);
    const guaranteed = allUpcoming.filter((m) => new Date(m.Date) < guaranteedThrough);
    const rest = allUpcoming.filter((m) => new Date(m.Date) >= guaranteedThrough);
    upcoming = guaranteed.concat(rest).slice(0, Math.max(FIXTURES_LOOKAHEAD_COUNT, guaranteed.length));
    const hasToday = upcoming.some((m) => isSameLocalDay(m.Date, today));
    note = hasToday
      ? ""
      : `<div class="empty-state" style="padding:0 0 12px;">No fixtures today &mdash; showing upcoming fixtures.</div>`;
  }

  const groups = groupByCompetition(upcoming);
  container.innerHTML = note + renderGroupedMatches(groups, state.collapsedFixtureGroups, (m) => `
    <div class="match-card" data-home-id="${escapeHtml(m.ID_1)}" data-away-id="${escapeHtml(m.ID_2)}" data-home-name="${escapeHtml(m.Home)}" data-away-name="${escapeHtml(m.Away)}">
      <div class="match-comp">
        <span>${escapeHtml(formatKickoff(m.Date))}</span>
      </div>
      <div class="match-teams">
        <div class="match-team">
          ${escapeHtml(m.Home)}
          ${clubScoreLabel(m.HomeScr)}
        </div>
        ${matchScoreCenter(m)}
        <div class="match-team away">
          ${escapeHtml(m.Away)}
          ${clubScoreLabel(m.AwayScr)}
        </div>
      </div>
      ${matchProbsRow(m)}
      <div class="lineup-panel" hidden></div>
    </div>
  `);
}

function projScoreSub(raw) {
  const n = parseFloat(raw);
  if (!Number.isFinite(n)) return "";
  return `<div class="match-score-sub">${n.toFixed(1)}</div>`;
}

// Sub-value under each score is the frozen pre-kickoff prediction (SnapProjH/
// SnapProjA), not the live ProjH/ProjA - see matchProbsRowSnapshot.
function finalScoreCenter(m) {
  return `
    <div class="match-score has-proj">
      <div class="score-col">
        <span class="proj-box">${escapeHtml(m.HomeS)}</span>
        ${projScoreSub(m.SnapProjH)}
      </div>
      <span class="vs-text">&ndash;</span>
      <div class="score-col">
        <span class="proj-box">${escapeHtml(m.AwayS)}</span>
        ${projScoreSub(m.SnapProjA)}
      </div>
    </div>
  `;
}

function renderResults() {
  const container = document.getElementById("results-list");
  const leagueIds = competitionIdsFor(state.resultFilter);
  const dateFilter = parseLocalDateInput(state.resultDateFilter);
  const roundFilter = state.resultRoundFilter;
  const matching = state.fixtures
    .filter((m) => toNum(m.Finished) === 1 && toNum(m.Cancelled) === 0 && m.Date)
    .filter((m) => !leagueIds || leagueIds.includes(String(m.ID)))
    .filter((m) => !dateFilter || isSameLocalDay(m.Date, dateFilter))
    .filter((m) => !roundFilter || String(m.Round || "").trim() === roundFilter)
    .sort((a, b) => new Date(b.Date) - new Date(a.Date));

  // A specific date or round is a deliberately narrow query - show
  // everything that matches instead of capping to the default rolling count.
  const recent = (dateFilter || roundFilter) ? matching : matching.slice(0, CONFIG.resultsCount);

  if (!recent.length) {
    container.innerHTML = `<div class="empty-state">No recent results found.</div>`;
    return;
  }

  const groups = groupByCompetition(recent);
  container.innerHTML = renderGroupedMatches(groups, state.collapsedResultGroups, (m) => `
    <div class="match-card">
      <div class="match-comp">
        <span>${escapeHtml(formatKickoff(m.Date))}</span>
      </div>
      <div class="match-teams">
        <div class="match-team">
          ${escapeHtml(m.Home)}
          ${clubScoreLabel(m.SnapHomeScr)}
        </div>
        ${finalScoreCenter(m)}
        <div class="match-team away">
          ${escapeHtml(m.Away)}
          ${clubScoreLabel(m.SnapAwayScr)}
        </div>
      </div>
      ${matchProbsRowSnapshot(m)}
    </div>
  `);
}

// Pos (broad G/D/M/F) drives which column P shows: defenders get xDD
// (expected defensive duels/actions), midfielders and strikers get xDM.
function fplRow(p) {
  const pos = p.Pos || "";
  const defStat = pos === "D" ? toNum(p.xDD) : (pos === "M" || pos === "F") ? toNum(p.xDM) : null;
  return {
    name: p.Name || "",
    club: p.Club || "",
    pos,
    price: toNum(p.Price),
    mins: toNum(p.ExpMins),
    xpts: toNum(p.xptsNext),
    gw2: toNum(p["2GW"]),
    gw5: toNum(p["5GW"]),
    gw6: toNum(p["6GW"]),
    xg: toNum(p.xG),
    xa: toNum(p.xA),
    def: defStat,
  };
}

function renderFpl() {
  const body = document.getElementById("fpl-body");
  const query = document.getElementById("fpl-search").value.trim().toLowerCase();

  let rows = state.fpl.map(fplRow);
  if (query) {
    rows = rows.filter((r) =>
      r.name.toLowerCase().includes(query) || r.club.toLowerCase().includes(query)
    );
  }
  rows.sort((a, b) => (toNum(a[state.fplSortKey]) - toNum(b[state.fplSortKey])) * state.fplSortDir);
  rows = rows.slice(0, 100);

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="10"><div class="empty-state">No matching players.</div></td></tr>`;
    return;
  }
  body.innerHTML = rows.map((r) => `
    <tr>
      <td>
        <div class="player-name">${escapeHtml(r.name)}</div>
        <div class="player-sub">${escapeHtml(r.club)}${r.pos ? " &middot; " + escapeHtml(r.pos) : ""}</div>
      </td>
      <td class="num">${r.price.toFixed(1)}</td>
      <td class="num">${r.mins}</td>
      <td class="num">${r.xpts.toFixed(2)}</td>
      <td class="num">${r.gw2.toFixed(2)}</td>
      <td class="num">${r.gw5.toFixed(2)}</td>
      <td class="num">${r.gw6.toFixed(2)}</td>
      <td class="num">${r.xg.toFixed(2)}</td>
      <td class="num">${r.xa.toFixed(2)}</td>
      <td class="num">${r.def === null ? "&ndash;" : r.def.toFixed(2)}</td>
    </tr>
  `).join("");
}

// Club tab: Pl/W/D/L/GF/GA/GD/Pts are the current table (games played so
// far); TPL/TW/TD/TL/TGF/TGA/TGD/TPts are the projected final table
// (current + projected remaining games combined). "GF" and "PPts" both
// collide with earlier per-90-style columns earlier in the row, so
// PapaParse's dedup renames the current table's own "GF" to "GF_1".
function clubRow(c) {
  return {
    name: c.Name || "",
    league: String(c.PrimaryLeague || ""),
    current: {
      pl: toNum(c.Pl), w: toNum(c.W), d: toNum(c.D), l: toNum(c.L),
      gf: toNum(c.GF_1), ga: toNum(c.GA), gd: toNum(c.GD), pts: toNum(c.Pts),
    },
    projected: {
      pl: toNum(c.TPL), w: toNum(c.TW), d: toNum(c.TD), l: toNum(c.TL),
      gf: toNum(c.TGF), ga: toNum(c.TGA), gd: toNum(c.TGD), pts: toNum(c.TPts),
    },
  };
}

// Club ID -> short code (e.g. "8456" -> "MCI"), used to resolve a
// fixture's Home/Away Club ID (Matches!ID_1/ID_2) to the code LineupsCache
// keys its rows by.
function clubCodeByClubId() {
  const map = {};
  state.club.forEach((c) => {
    const id = String(c["Club ID"] || "").trim();
    const code = String(c.Club || "").trim();
    if (id && code) map[id] = code;
  });
  return map;
}

// Club short code -> { position: {name, mins, age, ability} }, from the
// pre-computed LineupsCache tab (see CONFIG.lineupsTabName).
function buildLineupsByClub(rows) {
  const map = {};
  rows.forEach((r) => {
    const club = (r.Club || "").trim();
    if (!club || !r.Name) return;
    if (!map[club]) map[club] = {};
    if (!map[club][r.Position]) map[club][r.Position] = [];
    map[club][r.Position].push({
      name: r.Name,
      mins: toNum(r.Mins),
      age: toNum(r.Age),
      ability: toNum(r.Ability),
      expGoals: toNum(r.ExpGoals),
      expAssists: toNum(r.ExpAssists),
    });
  });
  return map;
}

// Expected-minutes color coding for a player's row: 75+ green, 60-75
// yellow, 45-60 orange, under 45 red.
function minsColorClass(mins) {
  if (mins >= 75) return "mins-green";
  if (mins >= 60) return "mins-yellow";
  if (mins >= 45) return "mins-orange";
  return "mins-red";
}

function renderPitchPlayer(pos, entry) {
  return `
    <div class="pitch-player ${minsColorClass(entry.mins)}">
      <span class="pitch-player-pos">${pos}</span>
      <span class="pitch-player-name">${escapeHtml(entry.name)} <span class="pitch-player-ability">- ${entry.ability.toFixed(0)}</span></span>
      <span class="pitch-player-mins">${entry.mins}&prime;</span>
      <span class="pitch-player-xg">${entry.expGoals.toFixed(1)}xG</span>
      <span class="pitch-player-xa">${entry.expAssists.toFixed(1)}xA</span>
    </div>
  `;
}

function renderPitchColumn(lineup) {
  const body = PITCH_LINES.map((line) => {
    const players = line.positions.flatMap((pos) => {
      const entries = lineup ? lineup[pos] : null;
      if (!entries || !entries.length) return [];
      return entries.map((entry) => renderPitchPlayer(pos, entry));
    });
    if (!players.length) return "";
    return `<div class="pitch-group">${players.join("")}</div>`;
  }).join("");
  return body || `<div class="empty-state">Lineup not available.</div>`;
}

function renderLineupPanel(homeId, awayId, homeName, awayName) {
  const codeById = clubCodeByClubId();
  const homeCode = codeById[String(homeId)];
  const awayCode = codeById[String(awayId)];
  const homeLineup = homeCode ? state.lineupsByClub[homeCode] : null;
  const awayLineup = awayCode ? state.lineupsByClub[awayCode] : null;

  if (!homeLineup && !awayLineup) {
    return `<div class="empty-state">Lineup not available.</div>`;
  }

  return `
    <div class="lineup-pitch">
      <div class="pitch-team">
        <div class="pitch-team-name">${escapeHtml(homeName || "")}</div>
        ${renderPitchColumn(homeLineup)}
      </div>
      <div class="pitch-divider"></div>
      <div class="pitch-team">
        <div class="pitch-team-name">${escapeHtml(awayName || "")}</div>
        ${renderPitchColumn(awayLineup)}
      </div>
    </div>
  `;
}

function renderTable() {
  const body = document.getElementById("table-body");
  const leagueIds = LEAGUE_FILTERS[state.tableFilter];
  const projected = state.tableView === "projected";

  let rows = state.club
    .map(clubRow)
    .filter((r) => !leagueIds || leagueIds.includes(r.league))
    .map((r) => ({ name: r.name, stats: projected ? r.projected : r.current }));

  rows.sort((a, b) =>
    (b.stats.pts - a.stats.pts) || (b.stats.gd - a.stats.gd) || (b.stats.gf - a.stats.gf)
  );

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="10"><div class="empty-state">No clubs found.</div></td></tr>`;
    return;
  }
  const fmt = (n) => String(Math.round(n));
  body.innerHTML = rows.map((r, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(r.name)}</td>
      <td class="num">${fmt(r.stats.pl)}</td>
      <td class="num">${fmt(r.stats.w)}</td>
      <td class="num">${fmt(r.stats.d)}</td>
      <td class="num">${fmt(r.stats.l)}</td>
      <td class="num">${fmt(r.stats.gf)}</td>
      <td class="num">${fmt(r.stats.ga)}</td>
      <td class="num">${fmt(r.stats.gd)}</td>
      <td class="num">${fmt(r.stats.pts)}</td>
    </tr>
  `).join("");
}

function renderAiPlayerRow(p) {
  return `
    <div class="ai-player">
      <div class="ai-player-top">
        <span class="ai-player-pos">${escapeHtml(p.pos)}</span>
        <span class="ai-player-name">${escapeHtml(p.player)}</span>
        <span class="ai-player-xpts">${p.xpts.toFixed(1)}</span>
      </div>
      <div class="ai-player-meta">${escapeHtml(p.club)} &middot; &pound;${p.price.toFixed(1)}</div>
    </div>
  `;
}

function renderAiTransferRow(m) {
  return `
    <div class="ai-transfer-row">
      <span class="ai-transfer-gw">GW${m.gw}</span>
      <div class="ai-transfer-players">
        <div class="ai-transfer-out">OUT &nbsp;${escapeHtml(m.sell)}</div>
        <div class="ai-transfer-in">IN &nbsp;&nbsp;${escapeHtml(m.buy)}</div>
      </div>
      <span class="ai-transfer-type">${escapeHtml(m.type)}</span>
    </div>
  `;
}

function renderAiFpl() {
  const container = document.getElementById("ai-fpl-list");
  const blocks = [...state.aiFpl].sort((a, b) => a.gw - b.gw);
  const transfers = state.aiFplTransfers || { title: "", moves: [] };
  const squad = state.aiFplSquad || [];

  const transfersHtml = `
    <div class="ai-transfers-card">
      <div class="ai-gw-header"><span>Transfers</span></div>
      ${transfers.title ? `<div class="ai-transfers-title">${escapeHtml(transfers.title)}</div>` : ""}
      ${transfers.moves.length
        ? transfers.moves.map(renderAiTransferRow).join("")
        : `<div class="ai-transfers-title">No transfers currently planned - hit Update Transfers to check.</div>`}
    </div>
  `;

  const squadHtml = `
    <div class="ai-squad-card">
      <div class="ai-gw-header"><span>Current Squad</span><span>${squad.length}</span></div>
      ${squad.length
        ? squad.map(renderAiPlayerRow).join("")
        : `<div class="ai-transfers-title">No current squad data yet.</div>`}
    </div>
  `;

  const topRow = `<div class="ai-top-row">${squadHtml}${transfersHtml}</div>`;

  if (!blocks.length) {
    container.innerHTML = topRow + `<div class="empty-state">No AI FPL squad data yet.</div>`;
    return;
  }

  container.innerHTML = topRow + blocks.map((b) => `
    <div class="ai-gw-card">
      <div class="ai-gw-header">
        <span>GW${b.gw}</span>
        <span>${escapeHtml(b.formation)}</span>
        <span>${b.totalXpts.toFixed(2)} xPts</span>
      </div>
      <div class="ai-gw-section-label">Starting XI</div>
      ${b.xi.map(renderAiPlayerRow).join("")}
      ${b.bench.length ? `<div class="ai-gw-section-label">Bench</div>${b.bench.map(renderAiPlayerRow).join("")}` : ""}
    </div>
  `).join("");
}

// Google's publish-to-web CSV export is occasionally slow or outright
// hangs for minutes. Each tab's data is fetched and rendered independently
// (not one big Promise.all) so a stuck FPL fetch, say, can't leave
// Fixtures/Results stuck on "Loading..." forever too - and a hard timeout
// means a hung request eventually surfaces as an error instead of
// spinning indefinitely.
const FETCH_TIMEOUT_MS = 30000;

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(`${label} timed out after ${ms / 1000}s`)), ms)
    ),
  ]);
}

// Google's export stalls are usually transient - a couple of retries
// clears most of them up without the user ever seeing an error.
async function fetchWithRetry(taskFn, label, retries = 2, retryDelayMs = 1500) {
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      return await withTimeout(taskFn(), FETCH_TIMEOUT_MS, label);
    } catch (err) {
      lastErr = err;
      if (attempt < retries) {
        console.warn(`${label} failed (attempt ${attempt + 1}/${retries + 1}), retrying...`, err);
        await new Promise((r) => setTimeout(r, retryDelayMs));
      }
    }
  }
  throw lastErr;
}

function showLoadErrorCard(container, label) {
  container.innerHTML = `<div class="empty-state">Failed to load ${label}. Try Refresh.</div>`;
}

function showLoadErrorRow(tbody, colspan, label) {
  tbody.innerHTML = `<tr><td colspan="${colspan}"><div class="empty-state">Failed to load ${label}. Try Refresh.</div></td></tr>`;
}

async function loadData() {
  if (!CONFIG.spreadsheetId || !CONFIG.sheetsApiKey) {
    showConfigWarning(document.getElementById("fixtures-list"));
    showConfigWarning(document.getElementById("results-list"));
    document.getElementById("fpl-body").innerHTML = "";
    document.getElementById("table-body").innerHTML = "";
    setStatus("Not configured");
    return;
  }
  const btn = document.getElementById("refresh-btn");
  btn.dataset.loading = "true";
  setStatus("Loading…");

  const tasks = [
    fetchWithRetry(() => fetchSheetValues(CONFIG.matchesTabName).then((v) => sheetRowsToObjects(v)), "Matches")
      .then((fixtures) => {
        state.fixtures = fixtures;
        renderLeagueFilterChips("fixture");
        renderLeagueFilterChips("result");
        if (!initialDefaultsApplied) {
          initialDefaultsApplied = true;
          applyDefaultDateAndRound("fixture");
          applyDefaultDateAndRound("result");
        }
        populateRoundFilter("fixture");
        populateRoundFilter("result");
        renderFixtures();
        renderResults();
      })
      .catch((err) => {
        console.error(err);
        showLoadErrorCard(document.getElementById("fixtures-list"), "fixtures");
        showLoadErrorCard(document.getElementById("results-list"), "results");
        throw err;
      }),
    fetchWithRetry(() => fetchSheetValues(CONFIG.fplTabName), "FPL")
      .then((values) => {
        const fpl = sheetRowsToObjects(values, 1);
        attachFplXptsNext(fpl, values);
        state.fpl = fpl;
        renderFpl();
      })
      .catch((err) => {
        console.error(err);
        showLoadErrorRow(document.getElementById("fpl-body"), 10, "FPL data");
        throw err;
      }),
    fetchWithRetry(() => fetchSheetValues(CONFIG.clubTabName).then((v) => sheetRowsToObjects(v)), "Club")
      .then((club) => {
        state.club = club;
        renderTable();
      })
      .catch((err) => {
        console.error(err);
        showLoadErrorRow(document.getElementById("table-body"), 10, "the table");
        throw err;
      }),
    // No dedicated tab/error UI for this one - it only powers the
    // click-to-expand lineup on Fixtures. A failure here just means that
    // panel shows "Lineup not available" instead of blocking anything.
    fetchWithRetry(() => fetchSheetValues(CONFIG.lineupsTabName).then((v) => sheetRowsToObjects(v)), "Lineups")
      .then((lineups) => {
        state.lineupsByClub = buildLineupsByClub(lineups);
      })
      .catch((err) => console.error(err)),
    fetchWithRetry(() => fetchSheetValues(CONFIG.aiFplTabName).then((v) => sheetRowsRaw(v)), "AI FPL")
      .then((rows) => {
        state.aiFpl = parseAiFplBlocks(rows);
        state.aiFplTransfers = parseAiFplTransfers(rows);
        state.aiFplSquad = parseAiFplCurrentSquad(rows);
        renderAiFpl();
      })
      .catch((err) => {
        console.error(err);
        showLoadErrorCard(document.getElementById("ai-fpl-list"), "the AI FPL squad");
        throw err;
      }),
  ];

  const results = await Promise.allSettled(tasks);
  const failedCount = results.filter((r) => r.status === "rejected").length;
  setStatus(
    failedCount === 0
      ? "Updated " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })
      : `Updated with ${failedCount} error${failedCount > 1 ? "s" : ""}`
  );
  btn.dataset.loading = "false";
}

document.querySelectorAll("nav.tabs button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", "false"));
    btn.setAttribute("aria-selected", "true");
    const tab = btn.dataset.tab;
    document.querySelectorAll(".panel").forEach((p) => p.dataset.active = String(p.dataset.tab === tab));
  });
});

function wireMoreToggle(wrap) {
  const toggle = wrap.querySelector("[data-more-toggle]");
  const moreRow = wrap.querySelector(".filter-row-more");
  toggle.addEventListener("click", () => {
    const expanded = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!expanded));
    moreRow.hidden = expanded;
    toggle.innerHTML = expanded ? "More &#9662;" : "Less &#9652;";
  });
}
wireMoreToggle(document.getElementById("table-filters"));

// Fixtures/Results league chips are generated dynamically from whatever
// competitions are actually in the data (see renderLeagueFilterChips)
// rather than a fixed list, so click-handling is delegated on the wrap
// container instead of bound per-button - that keeps working regardless of
// how many times the chip HTML gets regenerated.
document.getElementById("fixture-filters").addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-chip[data-filter]");
  if (!btn) return;
  selectLeagueFilter("fixture", btn.dataset.filter);
});
document.getElementById("result-filters").addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-chip[data-filter]");
  if (!btn) return;
  selectLeagueFilter("result", btn.dataset.filter);
});

function wireDateRoundFilters(prefix, renderFn) {
  const dateInput = document.getElementById(`${prefix}-date-filter`);
  const dateClear = document.getElementById(`${prefix}-date-clear`);
  const roundSelect = document.getElementById(`${prefix}-round-filter`);
  const roundPrev = document.getElementById(`${prefix}-round-prev`);
  const roundNext = document.getElementById(`${prefix}-round-next`);

  dateInput.addEventListener("change", () => {
    state[`${prefix}DateFilter`] = dateInput.value;
    dateClear.hidden = !dateInput.value;
    renderFn();
  });
  dateClear.addEventListener("click", () => {
    dateInput.value = "";
    state[`${prefix}DateFilter`] = "";
    dateClear.hidden = true;
    renderFn();
  });
  roundSelect.addEventListener("change", () => {
    state[`${prefix}RoundFilter`] = roundSelect.value;
    updateRoundNavButtons(prefix);
    renderFn();
  });
  roundPrev.addEventListener("click", () => stepRound(prefix, -1));
  roundNext.addEventListener("click", () => stepRound(prefix, 1));
}
wireDateRoundFilters("fixture", renderFixtures);
wireDateRoundFilters("result", renderResults);

document.querySelectorAll("#table-filters .filter-chip[data-filter]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#table-filters .filter-chip[data-filter]").forEach((b) => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    state.tableFilter = btn.dataset.filter;
    renderTable();
  });
});

document.querySelectorAll("#table-view-toggle .filter-chip[data-view]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#table-view-toggle .filter-chip[data-view]").forEach((b) => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    state.tableView = btn.dataset.view;
    renderTable();
  });
});

function wireSortableTable(tableId, sortKeyProp, sortDirProp, renderFn) {
  const table = document.getElementById(tableId);
  const headers = table.querySelectorAll("th.sortable");
  headers.forEach((th) => {
    th.addEventListener("click", () => {
      if (state[sortKeyProp] === th.dataset.key) {
        state[sortDirProp] *= -1;
      } else {
        state[sortKeyProp] = th.dataset.key;
        state[sortDirProp] = -1;
      }
      headers.forEach((t) => t.classList.remove("active"));
      th.classList.add("active");
      renderFn();
    });
  });
}

document.getElementById("refresh-btn").addEventListener("click", loadData);
document.getElementById("fpl-search").addEventListener("input", renderFpl);
wireSortableTable("fpl-table", "fplSortKey", "fplSortDir", renderFpl);

// Fixture cards are rebuilt wholesale on every render, so this listens on
// the container once (event delegation) rather than re-binding a handler
// to each card - tapping a card toggles its own lineup panel, rendering it
// lazily from the already-loaded LineupsCache data (no fetch at click time).
document.getElementById("fixtures-list").addEventListener("click", (e) => {
  const jumpBtn = e.target.closest("[data-jump-league]");
  if (jumpBtn) {
    selectLeagueFilter("fixture", jumpBtn.dataset.jumpLeague);
    return;
  }
  const header = e.target.closest(".comp-group-header");
  if (header) {
    toggleGroupCollapse(header.closest(".comp-group"), state.collapsedFixtureGroups);
    return;
  }
  const card = e.target.closest(".match-card");
  if (!card) return;
  const panel = card.querySelector(".lineup-panel");
  if (!panel) return;
  if (!panel.hidden) {
    panel.hidden = true;
    return;
  }
  panel.innerHTML = renderLineupPanel(
    card.dataset.homeId, card.dataset.awayId,
    card.dataset.homeName, card.dataset.awayName
  );
  panel.hidden = false;
});

document.getElementById("results-list").addEventListener("click", (e) => {
  const jumpBtn = e.target.closest("[data-jump-league]");
  if (jumpBtn) {
    selectLeagueFilter("result", jumpBtn.dataset.jumpLeague);
    return;
  }
  const header = e.target.closest(".comp-group-header");
  if (!header) return;
  toggleGroupCollapse(header.closest(".comp-group"), state.collapsedResultGroups);
});

// Both AI FPL actions run synchronously against a slow custom formula (the
// same EXPECTED_MINUTES() bottleneck the lineups needed a cache to work
// around), so this can take a couple of minutes - the button just waits.
async function runAiFplAction(action, btn, label) {
  const statusEl = document.getElementById("ai-fpl-status");
  if (!CONFIG.aiFplScriptUrl) {
    statusEl.textContent = "Apps Script URL not configured yet.";
    return;
  }
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Running…";
  statusEl.textContent = `${label} is running - this can take a couple of minutes…`;
  try {
    const res = await fetch(`${CONFIG.aiFplScriptUrl}?action=${action}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    statusEl.textContent = `${label} finished - hit Refresh to see the update.`;
  } catch (err) {
    console.error(err);
    statusEl.textContent = `${label} failed: ${err.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

document.getElementById("ai-transfers-btn").addEventListener("click", (e) => {
  runAiFplAction("update_transfers", e.target, "Update Transfers");
});
document.getElementById("ai-confirm-btn").addEventListener("click", (e) => {
  if (!confirm("Confirm locks in this Gameweek's transfer(s) on the AIXI squad list. Only do this once you've actually made the moves in real FPL. Continue?")) return;
  runAiFplAction("confirm_transfers", e.target, "Confirm Transfers");
});

loadData();
</script>

// Fetches one tab's full contents as a raw array-of-arrays via the Sheets
// API v4 - see the CONFIG comment for why this replaced the old "Publish to
// web" CSV export (that pipeline had a ~15-22s floor per tab regardless of
// size, and would occasionally hang for minutes; this is typically under a
// second). FORMATTED_VALUE matches what the CSV export used to hand back
// (e.g. dates as the same ISO strings already used elsewhere, not raw
// Sheets serial numbers), so none of the downstream parsing needed to change.
async function fetchSheetValues(sheetName) {
  const url =
    `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.spreadsheetId}/values/` +
    `${encodeURIComponent(sheetName)}?key=${CONFIG.sheetsApiKey}&valueRenderOption=FORMATTED_VALUE`;
  const res = await fetch(url);
  if (!res.ok) {
    const body = await res.text().catch(() => "");
    throw new Error(`Sheets API "${sheetName}" failed (${res.status}): ${body.slice(0, 200)}`);
  }
  const data = await res.json();
  return data.values || [];
}

// Mirrors what the old PapaParse-based parseCsv/parseCsvWithHeaderRow calls
// relied on: drop rows that are entirely blank across every column (their
// skipEmptyLines:true), then build header->value objects from the row at
// headerRowIndex (0 for most tabs; FPL's real column headers sit one row
// below a merged group-label row - e.g. "xPts" spans several columns whose
// own headers are just "1".."5" - so FPL is called with 1). Repeated header
// names are de-duplicated the same way PapaParse's header:true does: the
// first occurrence keeps its bare name, later ones get _1, _2, ... (e.g.
// Matches' three "ID" columns become ID/ID_1/ID_2, used for the
// competition/home-club/away-club IDs respectively).
function sheetRowsToObjects(values, headerRowIndex = 0) {
  const rows = sheetRowsRaw(values);
  if (rows.length <= headerRowIndex) return [];
  const seen = new Map();
  const keys = rows[headerRowIndex].map((h, i) => {
    let key = (h || "").trim() || `col${i}`;
    if (seen.has(key)) {
      const count = seen.get(key) + 1;
      seen.set(key, count);
      key = `${key}_${count}`;
    } else {
      seen.set(key, 0);
    }
    return key;
  });
  return rows.slice(headerRowIndex + 1).map((row) => {
    const obj = {};
    keys.forEach((k, i) => { obj[k] = row[i]; });
    return obj;
  });
}

// Raw-array equivalent of the old parseCsvRaw - just the skipEmptyLines
// filtering, no header/object conversion (AIXI's repeating GW-block layout
// parses itself from row indices - see parseAiFplBlocks).
function sheetRowsRaw(values) {
  return (values || []).filter((row) => row.some((cell) => String(cell ?? "").trim() !== ""));
}

// FPL's "xPts" group's first sub-column is a moving target - its header
// reads "1" only at the very start of a season, then "2", "3"... as
// gameweeks pass (the same dynamic window AIXI's own readFplPlayers_
// already accounts for on the Apps Script side). Attaches each row's real
// next-gameweek xPts value as .xptsNext by column POSITION - found via the
// merged "xPts" label in the group-header row above the real headers -
// rather than by a name that stops matching once GW1 is over.
function attachFplXptsNext(fplRows, values) {
  const groupRow = (values[0] || []).map((h) => String(h || "").trim().toLowerCase());
  const xptsCol = groupRow.indexOf("xpts");
  if (xptsCol < 0) return;
  const dataRows = sheetRowsRaw(values).slice(2); // past the group-label row and the real header row
  fplRows.forEach((row, i) => {
    row.xptsNext = dataRows[i] ? dataRows[i][xptsCol] : "";
  });
}

// The AIXI tab isn't one flat table - it's repeating blocks, each starting
// with its own label row ("GW1 XI - 3-5-2 - 76.83 xPts") followed by its
// own header row (Role, Pos, Player, Club, Price, xPts, Order), then the
// XI and Bench rows for that gameweek. Walk the raw rows and regroup them.
function parseAiFplBlocks(rows) {
  const gwHeaderRe = /^GW(\d+)\s+XI/i;
  const blocks = [];
  let current = null;

  rows.forEach((row) => {
    const first = (row[0] || "").trim();
    const match = first.match(gwHeaderRe);
    if (match) {
      if (current) blocks.push(current);
      const formationMatch = first.match(/\d+-\d+(?:-\d+)*/);
      const xptsMatch = first.match(/([\d.]+)\s*xPts/i);
      current = {
        gw: Number(match[1]),
        label: first,
        formation: formationMatch ? formationMatch[0] : "",
        totalXpts: xptsMatch ? toNum(xptsMatch[1]) : 0,
        xi: [],
        bench: [],
      };
      return;
    }
    if (!current) return;
    if (first === "Role") return; // this block's own header row
    const [role, pos, player, club, price, xpts, order] = row;
    if (!player) return;
    const entry = {
      pos: (pos || "").trim(),
      player: (player || "").trim(),
      club: (club || "").trim(),
      price: toNum(price),
      xpts: toNum(xpts),
      order: toNum(order),
    };
    if ((role || "").trim().toLowerCase() === "bench") current.bench.push(entry);
    else current.xi.push(entry);
  });
  if (current) blocks.push(current);

  blocks.forEach((b) => b.bench.sort((a, c) => a.order - c.order));
  return blocks;
}

// Reads one of the Wildcard/Free Hit draft blocks (written by PLAN_WILDCARD/
// PLAN_FREE_HIT to fixed rows just after the GW XI blocks) - same row shape
// as a GW XI block, just matched by a fixed title prefix instead of the
// "GW\d+ XI" pattern parseAiFplBlocks uses, so a still-open draft never
// gets swept up as if it were a real planned gameweek. Once actually
// confirmed, CONFIRM_FREE_HIT rewrites row 26 as "GW2 XI (Free Hit) - ..."
// which *does* match parseAiFplBlocks - no dashboard change needed for
// that path, this parser is only for the not-yet-confirmed draft.
function parseAiFplPlanBlock(rows, titlePrefix) {
  const startIdx = rows.findIndex((row) => (row[0] || "").trim().toUpperCase().startsWith(titlePrefix.toUpperCase()));
  if (startIdx < 0) return null;

  const label = (rows[startIdx][0] || "").trim();
  const formationMatch = label.match(/\d+-\d+(?:-\d+)*/);
  const xptsMatch = label.match(/([\d.]+)\s*xPts/i);
  const block = {
    label,
    formation: formationMatch ? formationMatch[0] : "",
    totalXpts: xptsMatch ? toNum(xptsMatch[1]) : 0,
    xi: [],
    bench: [],
  };

  for (let i = startIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const first = (row[0] || "").trim();
    if (first === "Role") continue; // this block's own header row
    const [role, pos, player, club, price, xpts, order] = row;
    if (!player) break; // hit the next block's title row, or ran out of data
    const entry = {
      pos: (pos || "").trim(),
      player: (player || "").trim(),
      club: (club || "").trim(),
      price: toNum(price),
      xpts: toNum(xpts),
      order: toNum(order),
    };
    if ((role || "").trim().toLowerCase() === "bench") block.bench.push(entry);
    else block.xi.push(entry);
  }
  block.bench.sort((a, b) => a.order - b.order);
  return block.xi.length ? block : null;
}

// The Transfer plan table (AIXI!L14:U...) sits in the same published rows as
// the GW XI blocks above, just further right (columns L-U, indices 11-20) -
// same CSV, different columns, so this is a second pass over the same rows
// rather than a second fetch.
function parseAiFplTransfers(rows) {
  let title = "";
  let headerRow = -1;
  for (let i = 0; i < rows.length; i++) {
    const l = (rows[i][11] || "").trim();
    if (/^Transfers from current AIXI squad/i.test(l)) title = l;
    if (l === "GW" && (rows[i][12] || "").trim() === "Sell") {
      headerRow = i;
      break;
    }
  }
  if (headerRow < 0) return { title, moves: [] };

  const moves = [];
  for (let i = headerRow + 1; i < rows.length; i++) {
    const row = rows[i];
    const gw = Number((row[11] || "").trim());
    if (!Number.isFinite(gw) || !row[11]) break; // hit the trailing summary rows or end of the table
    const [, sell, , buy, , type, gain] = row.slice(11, 20);
    if ((type || "").trim().toUpperCase() === "ROLL") continue; // nothing to action for a rolled week
    if (!(sell || "").trim() && !(buy || "").trim()) continue;
    moves.push({
      gw,
      sell: (sell || "").trim(),
      buy: (buy || "").trim(),
      type: (type || "").trim(),
      gain: toNum(gain),
    });
  }
  return { title, moves };
}

// The Chip plan table (AIXI!L1:O6) sits above the Transfer plan in the same
// columns - "Chip"/"Best GW"/"Extra xPts"/"Recommendation" header, one row
// per chip. Recommendation text is "VERDICT" or "VERDICT – detail" (e.g.
// "HOLD – GW1 squad is built from scratch").
function parseAiFplChipPlan(rows) {
  let headerRow = -1;
  for (let i = 0; i < rows.length; i++) {
    if ((rows[i][11] || "").trim() === "Chip" && (rows[i][12] || "").trim() === "Best GW") {
      headerRow = i;
      break;
    }
  }
  if (headerRow < 0) return { title: "", chips: [] };

  const title = ((rows[headerRow - 1] && rows[headerRow - 1][11]) || "").trim();
  const chips = [];
  for (let i = headerRow + 1; i < rows.length; i++) {
    const name = (rows[i][11] || "").trim();
    if (!name) break;
    const recommendation = (rows[i][14] || "").trim();
    const dashIdx = recommendation.indexOf(" – ");
    chips.push({
      name,
      bestGw: (rows[i][12] || "").trim(),
      extraXpts: (rows[i][13] || "").trim(),
      verdict: dashIdx >= 0 ? recommendation.slice(0, dashIdx) : recommendation,
      detail: dashIdx >= 0 ? recommendation.slice(dashIdx + 3) : "",
    });
  }
  return { title, chips };
}

// The current-squad table (AIXI!A8:J23) sits in the same published rows too,
// above the GW XI blocks - same CSV, same second pass.
function parseAiFplCurrentSquad(rows) {
  let headerRow = -1;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if ((row[0] || "").trim() === "Pos" && (row[1] || "").trim() === "Player" && (row[2] || "").trim() === "Club") {
      headerRow = i;
      break;
    }
  }
  if (headerRow < 0) return [];

  const squad = [];
  for (let i = headerRow + 1; i < rows.length; i++) {
    const row = rows[i];
    const pos = (row[0] || "").trim();
    const player = (row[1] || "").trim();
    if (!pos || !player) break;
    squad.push({
      pos,
      player,
      club: (row[2] || "").trim(),
      price: toMoney(row[3]), // cell reads "£6.0" - toNum's plain parseFloat chokes on the currency symbol
      mins: toNum(row[4]), // expected minutes - drives the pitch view's mins-tier color
      xpts: toNum(row[5]), // first of the GW columns - next-gameweek projected points
    });
  }
  return squad;
}

function toNum(v) {
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : 0;
}

// Like toNum, but strips a leading currency symbol first (e.g. AIXI's Price
// column reads "£6.0" as FORMATTED_VALUE text - plain parseFloat can't
// start a match on a non-numeric character, so it'd otherwise read as 0).
function toMoney(v) {
  return toNum(String(v ?? "").replace(/[^0-9.-]/g, ""));
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function formatKickoff(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString(undefined, {
    weekday: "short", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit",
  });
}

function isSameLocalDay(dateStr, reference) {
  const d = new Date(dateStr);
  return (
    d.getFullYear() === reference.getFullYear() &&
    d.getMonth() === reference.getMonth() &&
    d.getDate() === reference.getDate()
  );
}

// HomeScr/AwayScr (columns V/Y on the Matches tab) are per-club rating
// values, not the match result - published as formatted numbers (e.g.
// "1,007") so commas need stripping before parsing.
function clubScoreLabel(raw) {
  if (raw == null || String(raw).trim() === "") return "";
  const n = parseFloat(String(raw).replace(/,/g, ""));
  if (!Number.isFinite(n)) return "";
  return `<div class="club-score">${Math.round(n).toLocaleString()}</div>`;
}

function matchScoreCenter(m) {
  const projH = parseFloat(m.ProjH);
  const projA = parseFloat(m.ProjA);
  if (!Number.isFinite(projH) || !Number.isFinite(projA)) {
    return `<div class="match-score"><span class="vs-text">vs</span></div>`;
  }
  return `
    <div class="match-score has-proj">
      <span class="proj-box">${projH.toFixed(1)}</span>
      <span class="vs-text">vs</span>
      <span class="proj-box">${projA.toFixed(1)}</span>
    </div>
  `;
}

// HW_1/D_1/AW_1: the Matches tab has two HW/D/AW column sets (columns
// AL-AN are 0/1 actual-result flags, AO-AQ are the model's win/draw/loss
// probabilities) - PapaParse dedupes the repeated headers by suffixing
// the second set with "_1". Only render once there's a real projection;
// the model rows without one carry a placeholder 0/1/0 (guaranteed draw).
// Shared by matchProbsRow (Fixtures - live, ever-updating projection) and
// matchProbsRowSnapshot (Results - frozen at whatever was projected before
// kickoff, since HomeScr/AwayScr and everything derived from them are
// TODAY()-dependent formulas that keep drifting after a match is finished).
function renderProbBar(projH, projA, hw, draw, aw) {
  if (!Number.isFinite(projH) || !Number.isFinite(projA)) return "";
  if (![hw, draw, aw].every(Number.isFinite)) return "";

  const pctHw = Math.round(hw * 100);
  const pctDraw = Math.round(draw * 100);
  const pctAw = Math.round(aw * 100);
  const drawStart = pctHw;
  const awayStart = pctHw + pctDraw;
  return `
    <div class="match-probs">
      <div class="prob-bar">
        <span class="prob-home" style="width:${pctHw}%"></span>
        <span class="prob-draw" style="width:${pctDraw}%"></span>
        <span class="prob-away" style="width:${pctAw}%"></span>
      </div>
      <div class="prob-labels">
        <span class="prob-home" style="left:0%; width:${pctHw}%">${pctHw}%</span>
        <span class="prob-draw" style="left:${drawStart}%; width:${pctDraw}%">${pctDraw}%</span>
        <span class="prob-away" style="left:${awayStart}%; width:${pctAw}%">${pctAw}%</span>
      </div>
    </div>
  `;
}

function matchProbsRow(m) {
  return renderProbBar(
    parseFloat(m.ProjH), parseFloat(m.ProjA),
    parseFloat(m.HW_1), parseFloat(m.D_1), parseFloat(m.AW_1)
  );
}

// Results uses the frozen pre-kickoff snapshot instead of the live figures.
function matchProbsRowSnapshot(m) {
  return renderProbBar(
    parseFloat(m.SnapProjH), parseFloat(m.SnapProjA),
    parseFloat(m.SnapHomeWinPct), parseFloat(m.SnapDrawPct), parseFloat(m.SnapAwayWinPct)
  );
}

// <input type="date">'s value is "YYYY-MM-DD" - new Date(str) on that parses
// as UTC midnight, which can land on the wrong local day in negative-UTC
// timezones. Parse the components directly instead, so it lands on local
// midnight and compares correctly via isSameLocalDay.
function parseLocalDateInput(value) {
  if (!value) return null;
  const [y, m, d] = value.split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

// Fixtures/Results filter chips are generated from whichever competitions
// are actually in the data, keyed by Competition ID (not the raw "League"
// text - see COMPETITION_LABELS), most active first.
function buildCompetitionList() {
  const counts = new Map();
  state.fixtures.forEach((m) => {
    const id = String(m.ID || "").trim();
    if (!id) return;
    if (!counts.has(id)) counts.set(id, { id, autoLabel: m.League || id, count: 0 });
    counts.get(id).count++;
  });
  const list = [...counts.values()].map((c) => ({
    id: c.id,
    label: COMPETITION_LABELS[c.id] || c.autoLabel,
    count: c.count,
  }));
  list.sort((a, b) => b.count - a.count);
  return list;
}

// "all" -> no filter, "eng" -> the fixed English-competition set, anything
// else -> that one specific Competition ID.
function competitionIdsFor(filterValue) {
  if (filterValue === "all") return null;
  if (filterValue === "eng") return ENGLISH_COMPETITION_IDS;
  return [filterValue];
}

// Whether a filter value represents exactly one real competition - "all"
// and "eng" are aggregates spanning many competitions with unrelated round
// numbering, so round-based browsing doesn't apply to them.
function isSingleCompetitionFilter(filterValue) {
  const ids = competitionIdsFor(filterValue);
  return Array.isArray(ids) && ids.length === 1;
}

function dateStrOf(dateValue) {
  const d = new Date(dateValue);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function todayDateStr() {
  return dateStrOf(new Date());
}

// The "current" round for a single competition: the round containing the
// soonest still-to-be-played match, so a round already under way (some
// results in, some still to come) still lands there rather than jumping
// ahead - falling back to the most recently finished round only once the
// whole competition's visible fixture list is done.
function defaultRoundFor(filterValue) {
  const ids = competitionIdsFor(filterValue);
  if (!ids) return "";
  const relevant = state.fixtures.filter((m) =>
    ids.includes(String(m.ID)) && toNum(m.Cancelled) === 0 && m.Date
  );
  if (!relevant.length) return "";
  const upcoming = relevant.filter((m) => toNum(m.Started) === 0);
  if (upcoming.length) {
    upcoming.sort((a, b) => new Date(a.Date) - new Date(b.Date));
    return String(upcoming[0].Round || "").trim();
  }
  const finished = relevant
    .filter((m) => toNum(m.Finished) === 1)
    .sort((a, b) => new Date(b.Date) - new Date(a.Date));
  return finished.length ? String(finished[0].Round || "").trim() : "";
}

// Sets the date/round filters to this filter's default view: "All"/
// "English Teams" browse by date (today), one specific competition browses
// by round instead (see defaultRoundFor).
function applyDefaultDateAndRound(prefix) {
  const filterValue = state[`${prefix}Filter`];
  const dateInput = document.getElementById(`${prefix}-date-filter`);

  if (isSingleCompetitionFilter(filterValue)) {
    state[`${prefix}DateFilter`] = "";
    state[`${prefix}RoundFilter`] = defaultRoundFor(filterValue);
  } else {
    state[`${prefix}DateFilter`] = todayDateStr();
    state[`${prefix}RoundFilter`] = "";
  }
  dateInput.value = state[`${prefix}DateFilter`];
  updateSecondaryFilterVisibility(prefix);
}

function updateSecondaryFilterVisibility(prefix) {
  const dateGroup = document.querySelector(`#${prefix}-date-filter`)?.closest(".date-filter-group");
  const roundGroup = document.querySelector(`#${prefix}-round-filter`)?.closest(".round-filter-group");
  const showRound = isSingleCompetitionFilter(state[`${prefix}Filter`]);
  if (dateGroup) {
    dateGroup.hidden = showRound;
    dateGroup.style.display = showRound ? "none" : "";
  }
  if (roundGroup) {
    roundGroup.hidden = !showRound;
    roundGroup.style.display = showRound ? "" : "none";
  }
}

// (Re)builds the league filter chips for a Fixtures/Results panel from
// buildCompetitionList - "All" and "English Teams" are always pinned first,
// then real competitions most-active-first, split across the visible row
// and the "More" row the same way the old static markup did.
// Fixed display order for the league chips - "All" is always first, then
// this primary row (before "More"). Any of these not currently present in
// the data (e.g. a competition with zero matches right now) is skipped
// rather than shown as a dead filter.
const FIXTURE_PRIMARY_CHIP_ORDER = ["47", "42", "73", "10216", "48", "108", "109", "117", "eng"];
// Curated order for the start of the "More" row - anything discovered in
// the data that isn't listed here is appended after, most-active-first
// (see buildCompetitionList), so a newly appearing competition is never
// silently hidden.
const MORE_CHIP_ORDER = ["54", "87", "55", "53", "71", "536", "268", "132", "133", "142", "8944", "9084", "45", "299", "525", "9469", "526"];
const FIXTURE_MORE_ROW_GROUPS = [
  ["54", "87", "55", "53", "71", "536", "268"],
  ["132", "133", "142", "8944", "9084"],
  ["45", "299", "525", "9469", "526"],
];

function renderLeagueFilterChips(prefix) {
  const wrap = document.getElementById(`${prefix}-filters`);
  const mainRow = wrap.querySelector(".filter-row");
  const moreRow = wrap.querySelector(".filter-row-more");
  const currentFilter = state[`${prefix}Filter`];
  const competitions = buildCompetitionList();
  const present = new Set(competitions.map((c) => c.id));

  const chip = (id, label, fullLabel = label, shortLabel = label) => {
    const hasShort = (prefix === "fixture" || prefix === "result") && shortLabel !== label;
    const labelHtml = hasShort
      ? `<span class="filter-label-full has-short">${escapeHtml(label)}</span><span class="filter-label-short">${escapeHtml(shortLabel)}</span>`
      : escapeHtml(label);
    return `<button type="button" class="filter-chip" data-filter="${escapeHtml(id)}" aria-label="${escapeHtml(fullLabel)}" title="${escapeHtml(fullLabel)}" aria-pressed="${currentFilter === id}">${labelHtml}</button>`;
  };
  const labelForId = (id) => COMPETITION_LABELS[id] || competitions.find((c) => c.id === id)?.label || id;
  const shortLabelForId = (id) => FIXTURE_MOBILE_FILTER_LABELS[id] || labelForId(id);

  const primaryOrder = FIXTURE_PRIMARY_CHIP_ORDER;
  const primaryIds = primaryOrder.filter((id) =>
    id === "eng" || prefix === "fixture" || prefix === "result" || present.has(id)
  );
  const primary = [
    chip("all", "All", "All", shortLabelForId("all")),
    ...primaryIds.map((id) =>
      chip(
        id,
        id === "eng" ? "English Teams" : labelForId(id),
        id === "eng" ? "English Teams" : labelForId(id),
        id === "eng" ? shortLabelForId("eng") : shortLabelForId(id)
      )
    ),
  ];

  const coveredIds = new Set([...primaryIds, "eng"]);
  let rest;
  if (prefix === "fixture" || prefix === "result") {
    const fixtureMoreIds = new Set(FIXTURE_MORE_ROW_GROUPS.flat());
    fixtureMoreIds.forEach((id) => coveredIds.add(id));
    const fixtureRest = competitions.filter((c) => !coveredIds.has(c.id));
    rest = [
      ...FIXTURE_MORE_ROW_GROUPS.flatMap((group, index) => [
        ...(index > 0 ? [`<span class="filter-row-break" aria-hidden="true"></span>`] : []),
        ...group.map((id) => chip(id, labelForId(id), labelForId(id), shortLabelForId(id))),
      ]),
      ...(fixtureRest.length ? [`<span class="filter-row-break" aria-hidden="true"></span>`] : []),
      ...fixtureRest.map((c) => chip(c.id, c.label, c.label, shortLabelForId(c.id))),
    ];
  } else {
    const moreIdsOrdered = MORE_CHIP_ORDER.filter((id) => present.has(id) && !coveredIds.has(id));
    moreIdsOrdered.forEach((id) => coveredIds.add(id));
    const moreRest = competitions.filter((c) => !coveredIds.has(c.id));
    rest = [
      ...moreIdsOrdered.map((id) => chip(id, labelForId(id), labelForId(id), shortLabelForId(id))),
      ...moreRest.map((c) => chip(c.id, c.label, c.label, shortLabelForId(c.id))),
    ];
  }

  mainRow.innerHTML =
    primary.join("") +
    `<button type="button" class="filter-chip filter-more" data-more-toggle aria-label="Show more leagues" title="Show more leagues" aria-expanded="false"><span class="filter-more-icon">&#9662;</span></button>`;
  moreRow.innerHTML = rest.join("");
  moreRow.hidden = true;
  wireMoreToggle(wrap);
}

// Applies a league selection and its default date/round view - used by both
// the filter chips and clicking a competition's name in a group header (see
// renderGroupedMatches).
function selectLeagueFilter(prefix, filterValue) {
  const wrap = document.getElementById(`${prefix}-filters`);
  wrap.querySelectorAll(".filter-chip[data-filter]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.filter === filterValue))
  );
  const targetChip = wrap.querySelector(`.filter-chip[data-filter="${CSS.escape(filterValue)}"]`);
  if (targetChip && targetChip.closest(".filter-row-more")) {
    const moreRow = wrap.querySelector(".filter-row-more");
    const toggle = wrap.querySelector("[data-more-toggle]");
    moreRow.hidden = false;
    toggle.setAttribute("aria-expanded", "true");
    toggle.setAttribute("aria-label", "Show fewer leagues");
    toggle.setAttribute("title", "Show fewer leagues");
    toggle.innerHTML = `<span class="filter-more-icon">&#9652;</span>`;
  }

  state[`${prefix}Filter`] = filterValue;
  applyDefaultDateAndRound(prefix);
  populateRoundFilter(prefix);
  renderMatches();
}

// The sorted list of rounds actually present for the currently selected
// competition - shared by populateRoundFilter (the <select>'s options) and
// stepRound (the prev/next buttons), so both always agree on what "next"
// means. Empty for "All"/"English Teams" - round numbers aren't comparable
// across competitions. A round is available whenever it has any match at
// all (finished or not), since selecting it shows both together.
function getAvailableRounds(prefix) {
  const filterValue = state[`${prefix}Filter`];
  if (!isSingleCompetitionFilter(filterValue)) return [];
  const ids = competitionIdsFor(filterValue);
  const relevant = state.fixtures.filter((m) =>
    ids.includes(String(m.ID)) && toNum(m.Cancelled) === 0 && m.Date
  );
  const rounds = [...new Set(relevant.map((m) => String(m.Round || "").trim()).filter(Boolean))];
  rounds.sort((a, b) => {
    const na = parseFloat(a);
    const nb = parseFloat(b);
    if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
    return a.localeCompare(b);
  });
  return rounds;
}

// Rebuilds the Round <select> for a Fixtures/Results panel from
// getAvailableRounds. Call whenever the league filter changes or fresh data
// loads, since both can change which rounds are available.
function populateRoundFilter(prefix) {
  const select = document.getElementById(`${prefix}-round-filter`);
  const rounds = getAvailableRounds(prefix);

  if (!isSingleCompetitionFilter(state[`${prefix}Filter`])) {
    select.innerHTML = `<option value="">Select a league for rounds</option>`;
    select.disabled = true;
    state[`${prefix}RoundFilter`] = "";
    updateRoundNavButtons(prefix);
    return;
  }

  const currentValue = state[`${prefix}RoundFilter`];
  select.innerHTML =
    `<option value="">All rounds</option>` +
    rounds.map((r) => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join("");
  select.disabled = rounds.length === 0;
  if (rounds.includes(currentValue)) {
    select.value = currentValue;
  } else {
    state[`${prefix}RoundFilter`] = "";
    select.value = "";
  }
  updateRoundNavButtons(prefix);
}

// Enables/disables the prev/next round buttons based on where the current
// round sits in getAvailableRounds - disabled entirely with no rounds
// available, and at whichever end is already showing.
function updateRoundNavButtons(prefix) {
  const rounds = getAvailableRounds(prefix);
  const prevBtn = document.getElementById(`${prefix}-round-prev`);
  const nextBtn = document.getElementById(`${prefix}-round-next`);
  const idx = rounds.indexOf(state[`${prefix}RoundFilter`]);

  prevBtn.disabled = rounds.length === 0 || idx === 0;
  nextBtn.disabled = rounds.length === 0 || idx === rounds.length - 1;
}

// Moves the round filter one step forward (direction=1) or back
// (direction=-1) through getAvailableRounds. If no round is currently
// selected (e.g. the user had picked "All rounds"), next jumps to the
// first round and previous jumps to the last.
function stepRound(prefix, direction) {
  const rounds = getAvailableRounds(prefix);
  if (!rounds.length) return;
  let idx = rounds.indexOf(state[`${prefix}RoundFilter`]);
  idx = idx === -1 ? (direction > 0 ? 0 : rounds.length - 1) : Math.min(rounds.length - 1, Math.max(0, idx + direction));

  state[`${prefix}RoundFilter`] = rounds[idx];
  document.getElementById(`${prefix}-round-filter`).value = rounds[idx];
  updateRoundNavButtons(prefix);
  renderMatches();
}

// Moves the date filter one day forward/back. Works regardless of which
// league filter is active (unlike round stepping, which needs one specific
// competition selected) - starts from today if no date is currently set.
function stepDate(prefix, direction) {
  const current = parseLocalDateInput(state[`${prefix}DateFilter`]) || new Date();
  current.setDate(current.getDate() + direction);
  const newDateStr = dateStrOf(current);

  state[`${prefix}DateFilter`] = newDateStr;
  document.getElementById(`${prefix}-date-filter`).value = newDateStr;
  renderMatches();
}

// Curated priority order for how competition groups are stacked in the
// Fixtures/Results list - domestic pyramid + major English/European cups
// first, then the rest of Europe, then National League and anything not
// explicitly listed (inserted at "__unlisted__", keeping their original
// chronological order relative to each other - see groupByCompetition), with
// National League N/S and PL2 deliberately last.
const GROUP_ORDER = [
  "47", "42", "132", "133", "73", "10216",
  "48", "108", "109", "142",
  "54", "87", "55", "53", "71", "536",
  "117",
  "__unlisted__",
  "8944", "9084",
];

// Groups an already-sorted match list by Competition ID (not the raw
// "League" text - see COMPETITION_LABELS), then stacks the groups by
// GROUP_ORDER rather than by whichever competition's first match happens to
// fall earliest/latest chronologically - a quiet cup tie shouldn't jump
// above the Premier League just because it kicks off a few hours sooner.
// Anything not in GROUP_ORDER keeps its original chronological order
// relative to other unlisted competitions.
function groupByCompetition(matches) {
  const order = [];
  const groups = {};
  matches.forEach((m) => {
    const id = String(m.ID || "").trim() || "other";
    if (!groups[id]) {
      groups[id] = { id, label: COMPETITION_LABELS[id] || m.League || "Other", matches: [] };
      order.push(id);
    }
    groups[id].matches.push(m);
  });

  const present = new Set(order);
  const listed = new Set(GROUP_ORDER.filter((id) => id !== "__unlisted__"));
  const unlisted = order.filter((id) => !listed.has(id));

  const sortedOrder = [];
  GROUP_ORDER.forEach((id) => {
    if (id === "__unlisted__") {
      sortedOrder.push(...unlisted);
    } else if (present.has(id)) {
      sortedOrder.push(id);
    }
  });

  return sortedOrder.map((id) => groups[id]);
}

// Wraps each competition's cards in a collapsible group. collapsedSet is
// state.collapsedFixtureGroups, so a group's open/closed state survives
// re-renders. The competition name is its own clickable target
// (data-jump-league) that switches the filter to just that competition,
// defaulting to its current round - separate from the caret/count, which
// just toggle the collapse (see the click handler on #fixtures-list).
function renderGroupedMatches(groups, collapsedSet, cardHtmlFn) {
  return groups.map((g) => {
    const collapsed = collapsedSet.has(g.id);
    return `
      <div class="comp-group${collapsed ? " collapsed" : ""}" data-comp-id="${escapeHtml(g.id)}">
        <div class="comp-group-header">
          <span class="comp-group-caret">${collapsed ? "&#9656;" : "&#9662;"}</span>
          <button type="button" class="comp-group-name" data-jump-league="${escapeHtml(g.id)}">${escapeHtml(g.label)}</button>
          <span class="comp-group-count">${g.matches.length}</span>
        </div>
        <div class="card-list">${g.matches.map(cardHtmlFn).join("")}</div>
      </div>
    `;
  }).join("");
}

function toggleGroupCollapse(groupEl, collapsedSet) {
  if (!groupEl) return;
  const id = groupEl.dataset.compId;
  const collapsed = collapsedSet.has(id);
  if (collapsed) {
    collapsedSet.delete(id);
  } else {
    collapsedSet.add(id);
  }
  groupEl.classList.toggle("collapsed", !collapsed);
  const caret = groupEl.querySelector(".comp-group-caret");
  if (caret) caret.innerHTML = !collapsed ? "&#9656;" : "&#9662;";
}

function formatDateOnly(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

// A not-yet-finished match renders with the live projection, clickable team
// names (opens the club fixtures modal) and a click-to-expand lineup panel.
function fixtureCardHtml(m) {
  return `
    <div class="match-card" data-home-id="${escapeHtml(m.ID_1)}" data-away-id="${escapeHtml(m.ID_2)}" data-home-name="${escapeHtml(m.Home)}" data-away-name="${escapeHtml(m.Away)}">
      <div class="match-comp">
        <span>${escapeHtml(formatKickoff(m.Date))}</span>
      </div>
      <div class="match-teams">
        <div class="match-team">
          <button type="button" class="team-name-link" data-team-id="${escapeHtml(m.ID_1)}" data-team-name="${escapeHtml(m.Home)}">${escapeHtml(m.Home)}</button>
          ${clubScoreLabel(m.HomeScr)}
        </div>
        ${matchScoreCenter(m)}
        <div class="match-team away">
          <button type="button" class="team-name-link" data-team-id="${escapeHtml(m.ID_2)}" data-team-name="${escapeHtml(m.Away)}">${escapeHtml(m.Away)}</button>
          ${clubScoreLabel(m.AwayScr)}
        </div>
      </div>
      ${matchProbsRow(m)}
      <div class="lineup-panel" hidden></div>
    </div>
  `;
}

// A finished match renders the final score (tinted by prediction accuracy)
// and the frozen pre-kickoff snapshot instead - see finalScoreCenter/
// matchProbsRowSnapshot for why the live figures aren't used here.
function resultCardHtml(m) {
  const tier = scoreAccuracyTier(m);
  return `
    <div class="match-card${tier ? ` ${tier.cls}` : ""}"${tier ? ` title="${escapeHtml(tier.label)}"` : ""}>
      <div class="match-card-top">
        ${tier ? `<div class="accuracy-badge" aria-label="${escapeHtml(tier.label)}">${tier.score}/5</div>` : "<span></span>"}
        <div class="match-comp">
          <span>${escapeHtml(formatKickoff(m.Date))}</span>
        </div>
      </div>
      <div class="match-teams">
        <div class="match-team">
          ${escapeHtml(m.Home)}
          ${clubScoreLabel(m.SnapHomeScr)}
        </div>
        ${finalScoreCenter(m)}
        <div class="match-team away">
          ${escapeHtml(m.Away)}
          ${clubScoreLabel(m.SnapAwayScr)}
        </div>
      </div>
      ${matchProbsRowSnapshot(m)}
    </div>
  `;
}

// Fixtures and Results are one merged list - each match renders as a
// fixture or result card purely based on its own Finished flag, so a single
// day (or round) can show a finished result right next to an upcoming
// fixture instead of needing two separate views.
function matchCardHtml(m) {
  return toNum(m.Finished) === 1 ? resultCardHtml(m) : fixtureCardHtml(m);
}

function renderMatches() {
  const container = document.getElementById("fixtures-list");
  const leagueIds = competitionIdsFor(state.fixtureFilter);
  const dateFilter = parseLocalDateInput(state.fixtureDateFilter);
  const roundFilter = state.fixtureRoundFilter;
  const matching = state.fixtures
    .filter((m) => toNum(m.Cancelled) === 0 && m.Date)
    .filter((m) => !leagueIds || leagueIds.includes(String(m.ID)))
    .filter((m) => !dateFilter || isSameLocalDay(m.Date, dateFilter))
    .filter((m) => !roundFilter || String(m.Round || "").trim() === roundFilter)
    .sort((a, b) => new Date(a.Date) - new Date(b.Date));

  let shown = matching;
  let note = "";
  if (!dateFilter && !roundFilter) {
    // No specific date/round chosen (e.g. the date field was cleared) -
    // Matches is a day-by-day view, so fall back to whichever single day
    // has anything on it nearest to today, rather than an artificial
    // rolling count.
    const today = new Date();
    const nearest = matching
      .slice()
      .sort((a, b) => Math.abs(new Date(a.Date) - today) - Math.abs(new Date(b.Date) - today))[0];
    if (nearest) {
      const nearestDay = new Date(nearest.Date);
      shown = matching.filter((m) => isSameLocalDay(m.Date, nearestDay));
      note = isSameLocalDay(nearest.Date, today)
        ? ""
        : `<div class="empty-state" style="padding:0 0 12px;">No matches today &mdash; showing ${escapeHtml(formatDateOnly(nearest.Date))}.</div>`;
    }
  }

  if (!shown.length) {
    container.innerHTML = `<div class="empty-state">No matches found.</div>`;
    return;
  }

  const groups = groupByCompetition(shown);
  container.innerHTML = note + renderGroupedMatches(groups, state.collapsedFixtureGroups, matchCardHtml);
}

function projScoreSub(raw) {
  const n = parseFloat(raw);
  if (!Number.isFinite(n)) return "";
  return `<div class="match-score-sub">${n.toFixed(1)}</div>`;
}

// For a match decided on penalties, FotMob's HomeS/AwayS actually holds
// goals-plus-shootout-penalties combined (e.g. a 1-1 draw that River Plate
// lost 7-8 on pens reports HomeS/AwayS as 8-9), not a real scoreline. Score
// (mirrored from MatchData's scoreStr) is the genuine regulation-time
// result and is what should be shown/graded against - HomeS/AwayS is only
// a fallback for the rare row where Score isn't populated.
function finalScore(m) {
  const parsed = String(m.Score || "").match(/^(\d+)\s*-\s*(\d+)$/);
  if (parsed) return { home: parseFloat(parsed[1]), away: parseFloat(parsed[2]) };
  const home = parseFloat(m.HomeS);
  const away = parseFloat(m.AwayS);
  return Number.isFinite(home) && Number.isFinite(away) ? { home, away } : null;
}

function decidedOnPenalties(m) {
  return /penalt/i.test(m.StatusReason || "");
}

// A projected/actual goal difference under 1 reads as "close game"; 1 or
// more reads as "clear win" - deliberately coarse, since the point is
// telling a nail-biter from a comfortable win, not measuring exact margins.
function marginBucket(gd) {
  return Math.abs(gd) < 1 ? "narrow" : "clear";
}

function poissonProbability(k, lambda) {
  if (!Number.isFinite(k) || !Number.isFinite(lambda) || k < 0 || lambda < 0) return 0;
  let factorial = 1;
  for (let i = 2; i <= k; i++) factorial *= i;
  return Math.exp(-lambda) * Math.pow(lambda, k) / factorial;
}

function mostLikelyScore(projH, projA) {
  let best = { home: 0, away: 0, probability: -1 };
  const maxGoals = Math.max(8, Math.ceil(Math.max(projH, projA) + 6));
  for (let home = 0; home <= maxGoals; home++) {
    for (let away = 0; away <= maxGoals; away++) {
      const probability = poissonProbability(home, projH) * poissonProbability(away, projA);
      if (probability > best.probability) best = { home, away, probability };
    }
  }
  return best;
}

// Scores the frozen pre-kickoff projection (SnapProjH/SnapProjA) on a 0-5
// scale. Exact score proximity is rewarded first, then correct result and
// margin shape, then progressively worse reads.
function scoreAccuracyTier(m) {
  const actual = finalScore(m);
  const actualH = actual ? actual.home : NaN;
  const actualA = actual ? actual.away : NaN;
  const projH = parseFloat(m.SnapProjH);
  const projA = parseFloat(m.SnapProjA);
  const hw = parseFloat(m.SnapHomeWinPct);
  const draw = parseFloat(m.SnapDrawPct);
  const aw = parseFloat(m.SnapAwayWinPct);
  if (![actualH, actualA, projH, projA].every(Number.isFinite)) return null;

  const actualGD = actualH - actualA;
  const projGD = projH - projA;
  const actualResult = actualGD > 0 ? "H" : actualGD < 0 ? "A" : "D";
  // The model's own most-likely outcome (highest of its win/draw/away
  // probabilities), not a threshold on the projected score's goal
  // difference - a near-even scoreline (e.g. 1.6-1.4) can still imply a
  // clear favorite once the draw probability is factored in (41/24/35).
  const hasProbabilities = [hw, draw, aw].every(Number.isFinite);
  const projResult = hasProbabilities
    ? (hw >= draw && hw >= aw ? "H" : aw >= draw ? "A" : "D")
    : (projGD > 0 ? "H" : projGD < 0 ? "A" : "D");
  const gdError = Math.abs(actualGD - projGD);
  const scoreError = Math.abs(actualH - projH) + Math.abs(actualA - projA);
  const maxTeamScoreError = Math.max(Math.abs(actualH - projH), Math.abs(actualA - projA));
  const gotWinnerRight = projResult === actualResult;

  const sameShape = marginBucket(actualGD) === marginBucket(projGD);
  const projectedClearWrongWay = marginBucket(projGD) === "clear" && Math.sign(projGD) !== Math.sign(actualGD);

  const tier = (score, label) => ({ score, cls: `acc-${score}`, label });
  const likelyScore = mostLikelyScore(projH, projA);

  if (likelyScore.home === actualH && likelyScore.away === actualA) return tier(5, "5/5 Exact Read");
  if (scoreError <= 0.75 && maxTeamScoreError <= 0.5) return tier(5, "5/5 Excellent");
  if (scoreError <= 1.5 && maxTeamScoreError <= 1) return tier(4, "4/5 Very Good");

  if (gotWinnerRight) {
    if (sameShape && gdError <= 2) return tier(4, "4/5 Very Good");
    if (gdError <= 3) return tier(3, "3/5 Decent");
    return tier(2, "2/5 Loose");
  }

  // If the strict H/D/A call missed but both the projection and actual score
  // were narrow, the match read was still useful.
  if (sameShape && marginBucket(actualGD) === "narrow") {
    return gdError <= 1.5 ? tier(3, "3/5 Decent") : tier(2, "2/5 Loose");
  }

  if (projectedClearWrongWay && gdError > 3) return tier(0, "0/5 Miles Off");
  if (gdError <= 1.5) return tier(2, "2/5 Loose");
  if (gdError <= 3) return tier(1, "1/5 Poor");
  return tier(0, "0/5 Miles Off");
}

const STATS_RANGES = {
  all: { label: "All Time", days: null },
  week: { label: "Last Week", days: 7 },
  month: { label: "Last Month", days: 30 },
  "six-months": { label: "Last 6 Months", days: 183 },
};

function statsCutoffDate(rangeKey) {
  const range = STATS_RANGES[rangeKey] || STATS_RANGES.all;
  if (!range.days) return null;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - range.days);
  return cutoff;
}

function predictionStatsRows() {
  const cutoff = statsCutoffDate(state.statsRange);
  return state.fixtures
    .filter((m) => toNum(m.Finished) === 1 && toNum(m.Cancelled) === 0 && m.Date)
    .filter((m) => !cutoff || new Date(m.Date) >= cutoff)
    .map((m) => {
      const actual = finalScore(m);
      const projH = parseFloat(m.SnapProjH);
      const projA = parseFloat(m.SnapProjA);
      const tier = scoreAccuracyTier(m);
      if (!actual || !Number.isFinite(projH) || !Number.isFinite(projA) || !tier) return null;
      return {
        score: tier.score,
        predictedGoals: projH + projA,
        actualGoals: actual.home + actual.away,
      };
    })
    .filter(Boolean);
}

function renderStats() {
  const summary = document.getElementById("stats-summary");
  const counts = document.getElementById("stats-counts");
  const note = document.getElementById("stats-note");
  if (!summary || !counts || !note) return;

  const rows = predictionStatsRows();
  const total = rows.length;
  const countByScore = [0, 0, 0, 0, 0, 0];
  rows.forEach((row) => countByScore[row.score] += 1);
  const avg = (key) => total ? rows.reduce((sum, row) => sum + row[key], 0) / total : 0;

  summary.innerHTML = [
    ["Rated Matches", total.toLocaleString()],
    ["Avg Pred Goals", avg("predictedGoals").toFixed(2)],
    ["Avg Actual Goals", avg("actualGoals").toFixed(2)],
    ["Avg Rating", total ? (rows.reduce((sum, row) => sum + row.score, 0) / total).toFixed(2) : "0.00"],
  ].map(([label, value]) => `
    <div class="stats-card">
      <div class="stats-label">${label}</div>
      <div class="stats-value">${value}</div>
    </div>
  `).join("");

  note.textContent = "Only finished matches with a snapshot projected score are included.";
  counts.innerHTML = [5, 4, 3, 2, 1, 0].map((score) => `
    <div class="stats-card acc-${score}">
      <div class="stats-label">${score}/5 Predictions</div>
      <div class="stats-value">${countByScore[score].toLocaleString()}</div>
    </div>
  `).join("");
}

// Sub-value under each score is the frozen pre-kickoff prediction (SnapProjH/
// SnapProjA), not the live ProjH/ProjA - see matchProbsRowSnapshot. The main
// score is the regulation-time result (see finalScore) with a "(pens)" tag
// on whichever side actually won the shootout - HomeS/AwayS is exactly the
// goals-plus-penalties combined total (see finalScore's comment), so the
// higher of the two raw values is the winning side.
function finalScoreCenter(m) {
  const score = finalScore(m);
  const homeDisplay = score ? score.home : escapeHtml(m.HomeS);
  const awayDisplay = score ? score.away : escapeHtml(m.AwayS);
  const pens = decidedOnPenalties(m);
  const homeWonPens = pens && parseFloat(m.HomeS) > parseFloat(m.AwayS);
  const awayWonPens = pens && parseFloat(m.AwayS) > parseFloat(m.HomeS);
  const pensTag = '<span class="pens-tag">(pens)</span>';
  return `
    <div class="match-score has-proj">
      ${homeWonPens ? pensTag : ""}
      <div class="score-col">
        <span class="proj-box">${homeDisplay}</span>
        ${projScoreSub(m.SnapProjH)}
      </div>
      <span class="vs-text">&ndash;</span>
      <div class="score-col">
        <span class="proj-box">${awayDisplay}</span>
        ${projScoreSub(m.SnapProjA)}
      </div>
      ${awayWonPens ? pensTag : ""}
    </div>
  `;
}

function renderResults() {
  const container = document.getElementById("results-list");
  const leagueIds = competitionIdsFor(state.resultFilter);
  const dateFilter = parseLocalDateInput(state.resultDateFilter);
  const roundFilter = state.resultRoundFilter;
  const matching = state.fixtures
    .filter((m) => toNum(m.Finished) === 1 && toNum(m.Cancelled) === 0 && m.Date)
    .filter((m) => !leagueIds || leagueIds.includes(String(m.ID)))
    .filter((m) => !dateFilter || isSameLocalDay(m.Date, dateFilter))
    .filter((m) => !roundFilter || String(m.Round || "").trim() === roundFilter)
    .sort((a, b) => new Date(b.Date) - new Date(a.Date));

  // A specific date or round is a deliberately narrow query - show
  // everything that matches instead of capping to the default rolling count.
  const recent = (dateFilter || roundFilter) ? matching : matching.slice(0, CONFIG.resultsCount);

  if (!recent.length) {
    container.innerHTML = `<div class="empty-state">No recent results found.</div>`;
    return;
  }

  const groups = groupByCompetition(recent);
  container.innerHTML = renderGroupedMatches(groups, state.collapsedResultGroups, (m) => {
    const tier = scoreAccuracyTier(m);
    return `
    <div class="match-card${tier ? ` ${tier.cls}` : ""}"${tier ? ` title="${escapeHtml(tier.label)}"` : ""}>
      <div class="match-card-top">
        ${tier ? `<div class="accuracy-badge" aria-label="${escapeHtml(tier.label)}">${tier.score}/5</div>` : "<span></span>"}
        <div class="match-comp">
          <span>${escapeHtml(formatKickoff(m.Date))}</span>
        </div>
      </div>
      <div class="match-teams">
        <div class="match-team">
          ${escapeHtml(m.Home)}
          ${clubScoreLabel(m.SnapHomeScr)}
        </div>
        ${finalScoreCenter(m)}
        <div class="match-team away">
          ${escapeHtml(m.Away)}
          ${clubScoreLabel(m.SnapAwayScr)}
        </div>
      </div>
      ${matchProbsRowSnapshot(m)}
    </div>
  `;
  });
}

// Pos (broad G/D/M/F) drives which column P shows: defenders get xDD
// (expected defensive duels/actions), midfielders and strikers get xDM.
function fplRow(p) {
  const pos = p.Pos || "";
  const defStat = pos === "D" ? toNum(p.xDD) : (pos === "M" || pos === "F") ? toNum(p.xDM) : null;
  return {
    name: p.Name || "",
    club: p.Club || "",
    pos,
    price: toNum(p.Price),
    mins: toNum(p.ExpMins),
    xpts: toNum(p.xptsNext),
    gw5: toNum(p["5GW"]),
    gw10: toNum(p["10GW"]),
    xg: toNum(p.xG),
    xa: toNum(p.xA),
    def: defStat,
  };
}

// Rebuilds the Club dropdown's options from whatever clubs are actually in
// state.fpl, alphabetically - only called once after the FPL tab's data
// loads (not on every renderFpl), so it doesn't reset the user's selection
// on every re-render/refresh.
function populateFplClubFilter() {
  const select = document.getElementById("fpl-club-filter");
  const previous = select.value;
  const clubs = [...new Set(state.fpl.map((p) => p.Club).filter(Boolean))].sort();
  select.innerHTML =
    `<option value="">All Clubs</option>` +
    clubs.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  if (clubs.includes(previous)) select.value = previous;
}

function renderFpl() {
  const body = document.getElementById("fpl-body");
  const query = document.getElementById("fpl-search").value.trim().toLowerCase();

  let rows = state.fpl.map(fplRow);
  if (query) {
    rows = rows.filter((r) =>
      r.name.toLowerCase().includes(query) || r.club.toLowerCase().includes(query)
    );
  }
  rows = rows.filter((r) => state.fplPosFilter.has(r.pos));
  if (state.fplClubFilter) {
    rows = rows.filter((r) => r.club === state.fplClubFilter);
  }
  rows = rows.filter((r) => r.price >= state.fplPriceMin && r.price <= state.fplPriceMax);
  rows.sort((a, b) => (toNum(a[state.fplSortKey]) - toNum(b[state.fplSortKey])) * state.fplSortDir);
  rows = rows.slice(0, 100);

  fplLastRows = rows;

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5"><div class="empty-state">No matching players.</div></td></tr>`;
    return;
  }
  body.innerHTML = rows.map((r, i) => `
    <tr data-fpl-idx="${i}">
      <td class="player-name">${escapeHtml(r.name)}</td>
      <td class="num">${escapeHtml(r.pos)}-${r.price.toFixed(1)}</td>
      <td class="num">${r.xpts.toFixed(2)}</td>
      <td class="num">${r.gw5.toFixed(2)}</td>
      <td class="num">${r.gw10.toFixed(2)}</td>
    </tr>
  `).join("");
}

// Club tab: Pl/W/D/L/GF/GA/GD/Pts are the current table (games played so
// far); TPL/TW/TD/TL/TGF/TGA/TGD/TPts are the projected final table
// (current + projected remaining games combined). "GF" and "PPts" both
// collide with earlier per-90-style columns earlier in the row, so
// PapaParse's dedup renames the current table's own "GF" to "GF_1".
function clubRow(c) {
  return {
    id: String(c["Club ID"] || "").trim(),
    name: c.Name || "",
    league: String(c.PrimaryLeague || ""),
    current: {
      pl: toNum(c.Pl), w: toNum(c.W), d: toNum(c.D), l: toNum(c.L),
      gf: toNum(c.GF_1), ga: toNum(c.GA), gd: toNum(c.GD), pts: toNum(c.Pts),
    },
    projected: {
      pl: toNum(c.TPL), w: toNum(c.TW), d: toNum(c.TD), l: toNum(c.TL),
      gf: toNum(c.TGF), ga: toNum(c.TGA), gd: toNum(c.TGD), pts: toNum(c.TPts),
    },
  };
}

// Club ID -> short code (e.g. "8456" -> "MCI"), used to resolve a
// fixture's Home/Away Club ID (Matches!ID_1/ID_2) to the code LineupsCache
// keys its rows by.
function clubCodeByClubId() {
  const map = {};
  state.club.forEach((c) => {
    const id = String(c["Club ID"] || "").trim();
    const code = String(c.Club || "").trim();
    if (id && code) map[id] = code;
  });
  return map;
}

// Club short code -> { position: {name, mins, age, ability} }, from the
// pre-computed LineupsCache tab (see CONFIG.lineupsTabName).
function buildLineupsByClub(rows) {
  const map = {};
  rows.forEach((r) => {
    const club = (r.Club || "").trim();
    if (!club || !r.Name) return;
    if (!map[club]) map[club] = {};
    if (!map[club][r.Position]) map[club][r.Position] = [];
    map[club][r.Position].push({
      name: r.Name,
      mins: toNum(r.Mins),
      age: toNum(r.Age),
      ability: toNum(r.Ability),
      expGoals: toNum(r.ExpGoals),
      expAssists: toNum(r.ExpAssists),
    });
  });
  return map;
}

// Expected-minutes color coding for a player's row: 75+ green, 60-75
// yellow, 45-60 orange, under 45 red.
function minsColorClass(mins) {
  if (mins >= 75) return "mins-green";
  if (mins >= 60) return "mins-yellow";
  if (mins >= 45) return "mins-orange";
  return "mins-red";
}

function renderPitchPlayer(pos, entry) {
  return `
    <div class="pitch-player ${minsColorClass(entry.mins)}">
      <span class="pitch-player-pos">${pos}</span>
      <span class="pitch-player-name">${escapeHtml(entry.name)} <span class="pitch-player-ability">- ${entry.ability.toFixed(0)}</span></span>
      <span class="pitch-player-mins">${entry.mins}&prime;</span>
      <span class="pitch-player-xg">${entry.expGoals.toFixed(1)}xG</span>
      <span class="pitch-player-xa">${entry.expAssists.toFixed(1)}xA</span>
    </div>
  `;
}

function renderPitchColumn(lineup) {
  const body = PITCH_LINES.map((line) => {
    const players = line.positions.flatMap((pos) => {
      const entries = lineup ? lineup[pos] : null;
      if (!entries || !entries.length) return [];
      return entries.map((entry) => renderPitchPlayer(pos, entry));
    });
    if (!players.length) return "";
    return `<div class="pitch-group">${players.join("")}</div>`;
  }).join("");
  return body || `<div class="empty-state">Lineup not available.</div>`;
}

function renderLineupPanel(homeId, awayId, homeName, awayName) {
  const codeById = clubCodeByClubId();
  const homeCode = codeById[String(homeId)];
  const awayCode = codeById[String(awayId)];
  const homeLineup = homeCode ? state.lineupsByClub[homeCode] : null;
  const awayLineup = awayCode ? state.lineupsByClub[awayCode] : null;

  if (!homeLineup && !awayLineup) {
    return `<div class="empty-state">Lineup not available.</div>`;
  }

  return `
    <div class="lineup-pitch">
      <div class="pitch-team">
        <div class="pitch-team-name">${escapeHtml(homeName || "")}</div>
        ${renderPitchColumn(homeLineup)}
      </div>
      <div class="pitch-divider"></div>
      <div class="pitch-team">
        <div class="pitch-team-name">${escapeHtml(awayName || "")}</div>
        ${renderPitchColumn(awayLineup)}
      </div>
    </div>
  `;
}

// A couple of full club names wrap onto a second line in the Table tab's
// narrow Club column - shortened for display there only. Everywhere else
// (the team fixtures modal's title, Fixtures/Results, etc.) keeps the full
// name, since only the Table tab is this tight on width.
const TABLE_SHORT_NAMES = {
  "Wolverhampton Wanderers": "Wolves",
  "Borussia Mönchengladbach": "Mönchengladbach",
  "Brighton & Hove Albion": "Brighton",
  "West Bromwich Albion": "West Brom",
  "Queens Park Rangers": "QPR",
  "Sheffield Wednesday": "Sheff Wednesday",
  "Wycombe Wanderers": "Wycombe",
  "Peterborough United": "Peterborough",
  "Forest Green Rovers": "Forest Green",
  "Kidderminster Harriers": "Kidderminster",
  "Athletico Paranaense": "Paranaense",
};
const tableDisplayName = (name) => TABLE_SHORT_NAMES[name] || name;

function renderTable() {
  const body = document.getElementById("table-body");
  const leagueIds = LEAGUE_FILTERS[state.tableFilter];
  const projected = state.tableView === "projected";

  let rows = state.club
    .map(clubRow)
    .filter((r) => !leagueIds || leagueIds.includes(r.league))
    .map((r) => ({ id: r.id, name: r.name, stats: projected ? r.projected : r.current }));

  rows.sort((a, b) =>
    (b.stats.pts - a.stats.pts) || (b.stats.gd - a.stats.gd) || (b.stats.gf - a.stats.gf)
  );

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty-state">No clubs found.</div></td></tr>`;
    return;
  }
  const relZoneSize = RELEGATION_ZONE_SIZE[state.tableFilter] || 0;
  const relPlayoffZoneSize = RELEGATION_PLAYOFF_ZONE_SIZE[state.tableFilter] || 0;
  const qualZoneSize = QUALIFICATION_ZONE_SIZE[state.tableFilter] || 0;
  const secondaryZoneSize = SECONDARY_ZONE_SIZE[state.tableFilter] || 0;
  const fmt = (n) => String(Math.round(n));
  body.innerHTML = rows.map((r, i) => {
    const inRelZone = relZoneSize > 0 && i >= rows.length - relZoneSize;
    const inRelPlayoffZone = !inRelZone && relPlayoffZoneSize > 0 &&
      i >= rows.length - relZoneSize - relPlayoffZoneSize && i < rows.length - relZoneSize;
    const inQualZone = !inRelZone && !inRelPlayoffZone && qualZoneSize > 0 && i < qualZoneSize;
    const inSecondaryZone = !inRelZone && !inRelPlayoffZone && !inQualZone &&
      secondaryZoneSize > 0 && i >= qualZoneSize && i < qualZoneSize + secondaryZoneSize;
    const rowClass = inRelZone ? "relegation-row"
      : inRelPlayoffZone ? "relegation-playoff-row"
      : inQualZone ? "qualification-row"
      : inSecondaryZone ? "playoff-row" : "";
    return `
    <tr class="${rowClass}" data-club-id="${escapeHtml(r.id)}" data-club-name="${escapeHtml(r.name)}">
      <td>${i + 1}</td>
      <td>${escapeHtml(tableDisplayName(r.name))}</td>
      <td class="num">${fmt(r.stats.pl)}</td>
      <td class="num">${fmt(r.stats.w)}-${fmt(r.stats.d)}-${fmt(r.stats.l)}</td>
      <td class="num">${fmt(r.stats.gf)}-${fmt(r.stats.ga)}</td>
      <td class="num">${fmt(r.stats.gd)}</td>

// GK/DEF/MID/FWD in that order, top to bottom - a standard FPL 15-man
// squad shape (2/5/5/3), reusing the same .pitch-player/.pitch-group look
// as the match lineup pitch (see renderPitchPlayer) but for price/xPts
// instead of ability/xG/xA, and color-tiered by expected minutes the same
// way.
const SQUAD_PITCH_ORDER = ["GK", "DEF", "MID", "FWD"];

function renderSquadPitchPlayer(p, isBenched, badge) {
  const badgeHtml = badge
    ? ` <span class="pitch-player-badge pitch-player-badge-${badge.toLowerCase()}">${badge}</span>`
    : "";
  return `
    <div class="pitch-player ${isBenched ? "mins-red" : "mins-green"}">
      <span class="pitch-player-pos">${escapeHtml(p.pos)}</span>
      <span class="pitch-player-name">${escapeHtml(p.player)}${badgeHtml}</span>
      <span class="pitch-player-price">&pound;${p.price.toFixed(1)}</span>
      <span class="pitch-player-xpts">${p.xpts.toFixed(1)}pts</span>
    </div>
  `;
}

function sumTopXpts(list, n) {
  return list.slice(0, n).reduce((sum, p) => sum + p.xpts, 0);
}

// The AI's own GW-by-GW XI/bench plan (parseAiFplBlocks) only covers next
// week onward - it doesn't cover the *current* gameweek, since that's
// already locked in. So for "who'd you bench right now", pick our own best
// starting XI from the squad's current-GW xPts column (parseAiFplCurrentSquad's
// "xpts" field - FPL!P2 confirms which GW that column actually is), subject
// to standard FPL formation rules: 1 GK, DEF 3-5, MID 2-5, FWD 1-3, 11
// total. Everyone not in that XI is "benched".
function computeCurrentGwBench(squad) {
  const byPos = { GK: [], DEF: [], MID: [], FWD: [] };
  squad.forEach((p) => { if (byPos[p.pos]) byPos[p.pos].push(p); });
  Object.values(byPos).forEach((list) => list.sort((a, b) => b.xpts - a.xpts));

  const benched = [...byPos.GK.slice(1)];

  let best = null;
  for (let d = 3; d <= Math.min(5, byPos.DEF.length); d++) {
    for (let m = 2; m <= Math.min(5, byPos.MID.length); m++) {
      const f = 10 - d - m;
      if (f < 1 || f > Math.min(3, byPos.FWD.length)) continue;
      const total = sumTopXpts(byPos.DEF, d) + sumTopXpts(byPos.MID, m) + sumTopXpts(byPos.FWD, f);
      if (!best || total > best.total) best = { d, m, f, total };
    }
  }
  if (best) {
    benched.push(...byPos.DEF.slice(best.d), ...byPos.MID.slice(best.m), ...byPos.FWD.slice(best.f));
  }
  return new Set(benched.map((p) => p.player));
}

// Captain/vice-captain: the two highest current-GW xPts among the starting
// XI (not the whole squad - benched players can't be captained), same
// convention the AI's own multi-week plans don't otherwise surface for the
// current gameweek since (see computeCurrentGwBench) it isn't planned there.
function computeCaptaincy(squad, benchedNames) {
  const starters = squad.filter((p) => !benchedNames.has(p.player)).sort((a, b) => b.xpts - a.xpts);
  return { captain: starters[0]?.player || null, vice: starters[1]?.player || null };
}

function renderSquadPitch(squad, benchedNames) {
  if (!squad.length) return `<div class="empty-state">No current squad data yet.</div>`;
  const { captain, vice } = computeCaptaincy(squad, benchedNames);
  const body = SQUAD_PITCH_ORDER.map((pos) => {
    const players = squad.filter((p) => p.pos === pos);
    if (!players.length) return "";
    return `<div class="pitch-group">${players.map((p) => {
      const badge = p.player === captain ? "C" : p.player === vice ? "VC" : "";
      return renderSquadPitchPlayer(p, benchedNames.has(p.player), badge);
    }).join("")}</div>`;
  }).join("");
  return `<div class="lineup-pitch squad-pitch">${body}</div>`;
}

function renderAiFpl() {
  const blocks = [...state.aiFpl].sort((a, b) => a.gw - b.gw);
  const transfers = state.aiFplTransfers || { title: "", moves: [] };
  const chipPlan = state.aiFplChipPlan || { title: "", chips: [] };
  const squad = state.aiFplSquad || [];

  // The AI's transfer plan starts the gameweek after the one that's
  // already locked in (see computeCurrentGwBench) - so "next gameweek"
  // is always state.currentGw + 1, e.g. GW3 while GW2 is current.
  const nextGw = Number.isFinite(state.currentGw) ? state.currentGw + 1 : null;
  const nextGwMoves = nextGw ? transfers.moves.filter((m) => m.gw === nextGw) : transfers.moves;

  document.getElementById("ai-next-transfers").innerHTML = `
    <div class="ai-transfers-card">
      <div class="ai-gw-header"><span>Transfers${nextGw ? ` &middot; GW${nextGw}` : ""}</span></div>
      ${nextGwMoves.length
        ? nextGwMoves.map(renderAiTransferRow).join("")
        : `<div class="ai-transfers-title">No transfers currently planned - hit Update Transfers to check.</div>`}
    </div>
  `;

  // Only the actionable question matters here: is there a chip worth
  // playing somewhere between now (state.currentGw) and the last
  // gameweek the plan actually covers - the title itself states that
  // range ("Chip plan (GW3–GW6)"), which can run past the highest
  // individual chip's own Best GW, so prefer parsing it from there and
  // only fall back to the max Best GW if the title's shape ever changes.
  const titleRangeMatch = chipPlan.title.match(/GW\d+\D+GW(\d+)/);
  const chipLastGw = titleRangeMatch
    ? Number(titleRangeMatch[1])
    : chipPlan.chips.reduce((max, c) => Math.max(max, Number(c.bestGw) || 0), 0);
  const playableChips = Number.isFinite(state.currentGw)
    ? chipPlan.chips.filter((c) =>
        c.verdict === "PLAY" && Number(c.bestGw) >= state.currentGw && Number(c.bestGw) <= chipLastGw
      )
    : chipPlan.chips.filter((c) => c.verdict === "PLAY");
  const chipRangeLabel = Number.isFinite(state.currentGw) && chipLastGw
    ? `GW${state.currentGw}&ndash;GW${chipLastGw}`
    : "";

  // Plan Wildcard/Plan Free Hit only show up when the Chip Plan actually
  // recommends playing that chip THIS gameweek - e.g. if Free Hit's Best
  // GW is a future week, not state.currentGw, there's nothing to draft yet.
  const wildcardRec = chipPlan.chips.find((c) => c.name === "Wildcard");
  const freeHitRec = chipPlan.chips.find((c) => c.name === "Free Hit");
  const showPlanWildcard = !!wildcardRec && wildcardRec.verdict === "PLAY" && Number(wildcardRec.bestGw) === state.currentGw;
  const showPlanFreeHit = !!freeHitRec && freeHitRec.verdict === "PLAY" && Number(freeHitRec.bestGw) === state.currentGw;
  document.getElementById("ai-plan-wc-btn").style.display = showPlanWildcard ? "" : "none";
  document.getElementById("ai-plan-fh-btn").style.display = showPlanFreeHit ? "" : "none";

  document.getElementById("ai-chip-plan").innerHTML = `
    <div class="ai-chip-card">
      <div class="ai-gw-header"><span>Chip plan${chipRangeLabel ? ` &middot; ${chipRangeLabel}` : ""}</span></div>
      ${playableChips.length
        ? playableChips.map(renderChipPlanRow).join("")
        : `<div class="ai-transfers-title">No chip recommended${chipRangeLabel ? ` for ${chipRangeLabel}` : ""}.</div>`}
    </div>
  `;

  const squadBenchedNames = computeCurrentGwBench(squad);
  const startingXpts = squad
    .filter((p) => !squadBenchedNames.has(p.player))
    .reduce((sum, p) => sum + p.xpts, 0);

  document.getElementById("ai-squad-section").innerHTML = `
    <div class="ai-squad-card">
      <div class="ai-gw-header">
        <span>Current Squad${state.currentGw ? ` &middot; GW${state.currentGw}` : ""}</span>
        <span>${startingXpts.toFixed(1)} pts</span>
      </div>
      ${renderSquadPitch(squad, squadBenchedNames)}
    </div>
  `;

  // Wildcard/Free Hit drafts (PLAN_WILDCARD/PLAN_FREE_HIT) - not yet
  // confirmed, so they're shown separately from the real squad/GW blocks
  // above. Reuses the exact same row renderer as the GW-by-GW cards below,
  // since a draft block has the identical {formation, totalXpts, xi, bench}
  // shape parseAiFplBlocks already produces.
  document.getElementById("ai-plan-section").innerHTML = [
    { plan: state.aiFplWildcardPlan, label: "Wildcard draft" },
    { plan: state.aiFplFreeHitPlan, label: "Free Hit draft" },
  ].filter((p) => p.plan).map(({ plan, label }) => `
    <div class="ai-gw-card">
      <div class="ai-gw-header">
        <span>${escapeHtml(label)}</span>
        <span>${escapeHtml(plan.formation)}</span>
        <span>${plan.totalXpts.toFixed(2)} xPts</span>
      </div>
      <div class="ai-gw-section-label">Starting XI</div>
      ${plan.xi.map(renderAiPlayerRow).join("")}
      ${plan.bench.length ? `<div class="ai-gw-section-label">Bench</div>${plan.bench.map(renderAiPlayerRow).join("")}` : ""}
    </div>
  `).join("");

  // Confirm Wildcard/Confirm Free Hit only make sense once PLAN_WILDCARD/
  // PLAN_FREE_HIT has actually written a draft to confirm - otherwise
  // there's nothing on AIXI for them to read back.
  document.getElementById("ai-confirm-wc-btn").style.display = state.aiFplWildcardPlan ? "" : "none";
  document.getElementById("ai-confirm-fh-btn").style.display = state.aiFplFreeHitPlan ? "" : "none";

  const container = document.getElementById("ai-fpl-list");
  if (!blocks.length) {
    container.innerHTML = `<div class="empty-state">No AI FPL squad data yet.</div>`;
    return;
  }

  container.innerHTML = blocks.map((b) => `
    <div class="ai-gw-card">
      <div class="ai-gw-header">
        <span>GW${b.gw}</span>
        <span>${escapeHtml(b.formation)}</span>
        <span>${b.totalXpts.toFixed(2)} xPts</span>
      </div>
      <div class="ai-gw-section-label">Starting XI</div>
      ${b.xi.map(renderAiPlayerRow).join("")}
      ${b.bench.length ? `<div class="ai-gw-section-label">Bench</div>${b.bench.map(renderAiPlayerRow).join("")}` : ""}
    </div>
  `).join("");
}

// Google's publish-to-web CSV export is occasionally slow or outright
// hangs for minutes. Each tab's data is fetched and rendered independently
// (not one big Promise.all) so a stuck FPL fetch, say, can't leave
// Fixtures/Results stuck on "Loading..." forever too - and a hard timeout
// means a hung request eventually surfaces as an error instead of
// spinning indefinitely.
const FETCH_TIMEOUT_MS = 30000;

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(`${label} timed out after ${ms / 1000}s`)), ms)
    ),
  ]);
}

// Google's export stalls are usually transient - a couple of retries
// clears most of them up without the user ever seeing an error.
async function fetchWithRetry(taskFn, label, retries = 2, retryDelayMs = 1500) {
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      return await withTimeout(taskFn(), FETCH_TIMEOUT_MS, label);
    } catch (err) {
      lastErr = err;
      if (attempt < retries) {
        console.warn(`${label} failed (attempt ${attempt + 1}/${retries + 1}), retrying...`, err);
        await new Promise((r) => setTimeout(r, retryDelayMs));
      }
    }
  }
  throw lastErr;
}

function showLoadErrorCard(container, label) {
  container.innerHTML = `<div class="empty-state">Failed to load ${label}. Try Refresh.</div>`;
}

function showLoadErrorRow(tbody, colspan, label) {
  tbody.innerHTML = `<tr><td colspan="${colspan}"><div class="empty-state">Failed to load ${label}. Try Refresh.</div></td></tr>`;
}

async function loadData() {
  if (!CONFIG.spreadsheetId || !CONFIG.sheetsApiKey) {
    showConfigWarning(document.getElementById("fixtures-list"));
    document.getElementById("fpl-body").innerHTML = "";
    document.getElementById("table-body").innerHTML = "";
    setStatus("Not configured");
    return;
  }
  const btn = document.getElementById("refresh-btn");
  btn.dataset.loading = "true";
  setStatus("Loading…");

  const tasks = [
    fetchWithRetry(() => fetchSheetValues(CONFIG.matchesTabName).then((v) => sheetRowsToObjects(v)), "Matches")
      .then((fixtures) => {
        state.fixtures = fixtures;
        renderLeagueFilterChips("fixture");
        if (!initialDefaultsApplied) {
          initialDefaultsApplied = true;
          applyDefaultDateAndRound("fixture");
        }
        populateRoundFilter("fixture");
        renderMatches();
        renderStats();
      })
      .catch((err) => {
        console.error(err);
        showLoadErrorCard(document.getElementById("fixtures-list"), "matches");
        throw err;
      }),
    fetchWithRetry(() => fetchSheetValues(CONFIG.fplTabName), "FPL")
      .then((values) => {
        const fpl = sheetRowsToObjects(values, 1);
        attachFplXptsNext(fpl, values);
        state.fpl = fpl;
        // FPL!P2 - the real header row's first per-GW column label (e.g.
        // "2" for GW2) - not hardcoded since this shifts forward every
        // week. Used to label which gameweek the squad pitch's bench pick
        // is actually for.
        state.currentGw = toNum(values[1] && values[1][15]);
        populateFplClubFilter();
        renderFpl();
        renderAiFpl();
      })
      .catch((err) => {
        console.error(err);
        showLoadErrorRow(document.getElementById("fpl-body"), 10, "FPL data");
        throw err;
      }),
    fetchWithRetry(() => fetchSheetValues(CONFIG.clubTabName).then((v) => sheetRowsToObjects(v)), "Club")
      .then((club) => {
        state.club = club;
        renderTable();
      })
      .catch((err) => {
        console.error(err);
        showLoadErrorRow(document.getElementById("table-body"), 7, "the table");
        throw err;
      }),
    // No dedicated tab/error UI for this one - it only powers the
    // click-to-expand lineup on Fixtures. A failure here just means that
    // panel shows "Lineup not available" instead of blocking anything.
    fetchWithRetry(() => fetchSheetValues(CONFIG.lineupsTabName).then((v) => sheetRowsToObjects(v)), "Lineups")
      .then((lineups) => {
        state.lineupsByClub = buildLineupsByClub(lineups);
      })
      .catch((err) => console.error(err)),
  ];

  if (aiFplAccessUnlocked) {
    tasks.push(fetchWithRetry(() => fetchSheetValues(CONFIG.aiFplTabName).then((v) => sheetRowsRaw(v)), "AI FPL")
      .then((rows) => {
        state.aiFpl = parseAiFplBlocks(rows);
        state.aiFplTransfers = parseAiFplTransfers(rows);
        state.aiFplChipPlan = parseAiFplChipPlan(rows);
        state.aiFplSquad = parseAiFplCurrentSquad(rows);
        state.aiFplWildcardPlan = parseAiFplPlanBlock(rows, "WILDCARD DRAFT");
        state.aiFplFreeHitPlan = parseAiFplPlanBlock(rows, "FREE HIT DRAFT");
        renderAiFpl();
      })
      .catch((err) => {
        console.error(err);
        showLoadErrorCard(document.getElementById("ai-fpl-list"), "the AI FPL squad");
        throw err;
      }));
  }

  const results = await Promise.allSettled(tasks);
  const failedCount = results.filter((r) => r.status === "rejected").length;
  setStatus(
    failedCount === 0
      ? "Updated " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })
      : `Updated with ${failedCount} error${failedCount > 1 ? "s" : ""}`
  );
  btn.dataset.loading = "false";
}

document.querySelectorAll("nav.tabs button").forEach((btn) => {
  btn.addEventListener("click", async () => {
    const tab = btn.dataset.tab;
    if (tab === "ai-fpl" && !aiFplAccessUnlocked) {
      const unlocked = await requestAiFplAccess();
      if (!unlocked) return;
      await loadData();
    }
    activateTab(tab);
  });
});

  });
}

// Fixtures/Results league chips are generated dynamically from whatever
// competitions are actually in the data (see renderLeagueFilterChips)
// rather than a fixed list, so click-handling is delegated on the wrap
// container instead of bound per-button - that keeps working regardless of
// how many times the chip HTML gets regenerated.
document.getElementById("fixture-filters").addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-chip[data-filter]");
  if (!btn) return;
  selectLeagueFilter("fixture", btn.dataset.filter);
});

function wireDateRoundFilters(prefix, renderFn) {
  const dateInput = document.getElementById(`${prefix}-date-filter`);
  const datePrev = document.getElementById(`${prefix}-date-prev`);
  const dateNext = document.getElementById(`${prefix}-date-next`);
  const roundSelect = document.getElementById(`${prefix}-round-filter`);
  const roundPrev = document.getElementById(`${prefix}-round-prev`);
  const roundNext = document.getElementById(`${prefix}-round-next`);

  datePrev.addEventListener("click", () => stepDate(prefix, -1));
  dateNext.addEventListener("click", () => stepDate(prefix, 1));
  dateInput.addEventListener("change", () => {
    state[`${prefix}DateFilter`] = dateInput.value;
    renderFn();
  });
  roundSelect.addEventListener("change", () => {
    state[`${prefix}RoundFilter`] = roundSelect.value;
    updateRoundNavButtons(prefix);
    renderFn();
  });
  roundPrev.addEventListener("click", () => stepRound(prefix, -1));
  roundNext.addEventListener("click", () => stepRound(prefix, 1));
}
wireDateRoundFilters("fixture", renderMatches);

document.querySelectorAll("#table-filters .filter-chip[data-filter]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#table-filters .filter-chip[data-filter]").forEach((b) => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    state.tableFilter = btn.dataset.filter;
    renderTable();

});

document.querySelectorAll("#table-view-toggle .filter-chip[data-view]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#table-view-toggle .filter-chip[data-view]").forEach((b) => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    state.tableView = btn.dataset.view;

});

document.querySelectorAll("#stats-range-filters .filter-chip[data-range]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#stats-range-filters .filter-chip[data-range]").forEach((b) => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    state.statsRange = btn.dataset.range;
    renderStats();
  });
});

function wireSortableTable(tableId, sortKeyProp, sortDirProp, renderFn) {
  const table = document.getElementById(tableId);
  const headers = table.querySelectorAll("th.sortable");
  headers.forEach((th) => {
    th.addEventListener("click", () => {
      if (state[sortKeyProp] === th.dataset.key) {
        state[sortDirProp] *= -1;
      } else {
        state[sortKeyProp] = th.dataset.key;
        state[sortDirProp] = -1;
      }
      headers.forEach((t) => t.classList.remove("active"));
      th.classList.add("active");
      renderFn();
    });
  });
}

document.getElementById("refresh-btn").addEventListener("click", loadData);
document.getElementById("fpl-search").addEventListener("input", renderFpl);
document.querySelectorAll("#fpl-pos-filters [data-pos]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const nowOn = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", String(nowOn));
    if (nowOn) state.fplPosFilter.add(btn.dataset.pos);
    else state.fplPosFilter.delete(btn.dataset.pos);
    renderFpl();
  });
});
document.getElementById("fpl-club-filter").addEventListener("change", (e) => {
  state.fplClubFilter = e.target.value;
  renderFpl();
});

// Classic dual-range-input pattern: each slider clamps against the other
// so the min handle can never pass the max handle and vice versa.
const fplPriceMinInput = document.getElementById("fpl-price-min");
const fplPriceMaxInput = document.getElementById("fpl-price-max");
const fplPriceDisplay = document.getElementById("fpl-price-display");

function updateFplPriceDisplay() {
  fplPriceDisplay.textContent = `£${state.fplPriceMin.toFixed(1)} – £${state.fplPriceMax.toFixed(1)}`;
}

fplPriceMinInput.addEventListener("input", () => {
  const max = parseFloat(fplPriceMaxInput.value);
  let min = Math.min(parseFloat(fplPriceMinInput.value), max);
  fplPriceMinInput.value = min;
  state.fplPriceMin = min;
  updateFplPriceDisplay();
  renderFpl();
});
fplPriceMaxInput.addEventListener("input", () => {
  const min = parseFloat(fplPriceMinInput.value);
  let max = Math.max(parseFloat(fplPriceMaxInput.value), min);
  fplPriceMaxInput.value = max;
  state.fplPriceMax = max;
  updateFplPriceDisplay();
  renderFpl();
});

wireSortableTable("fpl-table", "fplSortKey", "fplSortDir", renderFpl);

// Fixture cards are rebuilt wholesale on every render, so this listens on
// the container once (event delegation) rather than re-binding a handler
// to each card - tapping a card toggles its own lineup panel, rendering it
// lazily from the already-loaded LineupsCache data (no fetch at click time).
document.getElementById("fixtures-list").addEventListener("click", (e) => {
  const teamBtn = e.target.closest("[data-team-id]");
  if (teamBtn) {
    openTeamFixturesModal(teamBtn.dataset.teamId, teamBtn.dataset.teamName);
    return;
  }
  const jumpBtn = e.target.closest("[data-jump-league]");
  if (jumpBtn) {
    selectLeagueFilter("fixture", jumpBtn.dataset.jumpLeague);
    return;
  }
  const header = e.target.closest(".comp-group-header");
  if (header) {
    toggleGroupCollapse(header.closest(".comp-group"), state.collapsedFixtureGroups);
    return;
  }
  const card = e.target.closest(".match-card");
  if (!card) return;
  const panel = card.querySelector(".lineup-panel");
  if (!panel) return;
  if (!panel.hidden) {
    panel.hidden = true;
    return;
  }
  panel.innerHTML = renderLineupPanel(
    card.dataset.homeId, card.dataset.awayId,
    card.dataset.homeName, card.dataset.awayName
  );
  panel.hidden = false;
});

// Both AI FPL actions run synchronously against a slow custom formula (the
// same EXPECTED_MINUTES() bottleneck the lineups needed a cache to work
// around), so this can take a couple of minutes - the button just waits.
async function runAiFplAction(action, btn, label) {
  const statusEl = document.getElementById("ai-fpl-status");
  if (!aiFplAccessUnlocked) {
    statusEl.textContent = "AI FPL is locked.";
    return;
  }
  if (!CONFIG.aiFplScriptUrl) {
    statusEl.textContent = "Apps Script URL not configured yet.";
    return;
  }
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Running…";
  statusEl.textContent = `${label} is running - this can take a couple of minutes…`;
  try {
    const res = await fetch(`${CONFIG.aiFplScriptUrl}?action=${action}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    statusEl.textContent = `${label} finished - hit Refresh to see the update.`;
  } catch (err) {
    console.error(err);
    statusEl.textContent = `${label} failed: ${err.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

document.getElementById("ai-transfers-btn").addEventListener("click", (e) => {
